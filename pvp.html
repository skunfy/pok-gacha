<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gachax — PVP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0b18;--bg2:#0f1020;--bg3:#161728;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --text:#e8eaf6;--muted:rgba(255,255,255,.45);
  --gold:#ffd84d;--purple:#7f5cff;--red:#ff4444;--green:#33ff99;
  --bronze:#cd7f32;--silver:#aaa;--platine:#4da6ff;--diamond:#c084ff;--master:#ff6464;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* NAV */
.nav{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.nav-title{font-size:17px;font-weight:900;background:linear-gradient(135deg,#7f5cff,#f053c5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-back{font-size:13px;cursor:pointer;padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text)}
.nav-back:hover{background:var(--bg3)}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab-btn{font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.tab-btn.active{background:var(--purple);color:#fff;border-color:transparent}

/* LAYOUT */
.page{max-width:900px;margin:0 auto;padding:20px 16px}
.section{display:none}
.section.active{display:block}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:18px}
.card+.card{margin-top:12px}
.card-title{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.4;margin-bottom:14px}

/* PROFILE */
.fighter-profile{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.fighter-avatar{width:64px;height:64px;border-radius:50%;background:var(--bg3);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.fighter-info{flex:1}
.fighter-name{font-size:18px;font-weight:900;margin-bottom:2px}
.fighter-meta{font-size:12px;opacity:.5;margin-bottom:6px}
.rank-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.rank-pts{font-size:11px;opacity:.6;margin-left:4px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:500px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-box{background:var(--bg3);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)}
.stat-box-val{font-size:20px;font-weight:900;margin-bottom:2px}
.stat-box-label{font-size:10px;opacity:.45;text-transform:uppercase;letter-spacing:.05em}

/* SEARCH */
.search-wrap{display:flex;gap:8px;margin-bottom:14px}
.search-wrap input{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px}
.search-wrap input:focus{outline:none;border-color:var(--purple)}
.search-wrap button{padding:10px 16px;background:var(--purple);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;font-size:13px}
.search-wrap button:hover{opacity:.85}
.user-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);margin-bottom:8px;transition:.15s}
.user-row:hover{border-color:var(--border2)}
.user-row-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.user-row-info{flex:1}
.user-row-name{font-size:14px;font-weight:700}
.user-row-rank{font-size:11px;opacity:.5;margin-top:2px}
.challenge-btn{padding:7px 14px;background:linear-gradient(135deg,#7f5cff,#f053c5);border:none;border-radius:8px;color:#fff;font-weight:800;font-size:12px;cursor:pointer;flex-shrink:0}
.challenge-btn:hover{opacity:.85}
.challenge-btn:disabled{opacity:.4;cursor:not-allowed}

/* PENDING */
.challenge-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--bg3);border:1px solid rgba(255,184,0,.2);margin-bottom:10px}
.challenge-card-info{flex:1}
.challenge-card-name{font-size:14px;font-weight:700}
.challenge-card-sub{font-size:11px;opacity:.5;margin-top:2px}
.challenge-actions{display:flex;gap:8px}
.btn-accept{padding:7px 14px;background:#1D9E75;border:none;border-radius:8px;color:#fff;font-weight:800;font-size:12px;cursor:pointer}
.btn-decline{padding:7px 14px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;margin-bottom:7px;background:var(--bg3);border:1px solid var(--border);transition:.15s}
.lb-row.me{border-color:rgba(127,92,255,.4);background:rgba(127,92,255,.06)}
.lb-rank-num{font-size:15px;font-weight:900;width:28px;text-align:center;flex-shrink:0}
.lb-avatar{width:36px;height:36px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.lb-name{flex:1;font-size:13px;font-weight:700}
.lb-stats{font-size:11px;opacity:.45;margin-top:2px}
.lb-pts{font-size:14px;font-weight:900;text-align:right}
.lb-rank-badge{font-size:10px;opacity:.7;text-align:right}

/* HISTORY */
.hist-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:7px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:.15s}
.hist-row:hover{border-color:var(--border2)}
.hist-result{font-size:20px;flex-shrink:0}
.hist-info{flex:1}
.hist-vs{font-size:13px;font-weight:700}
.hist-sub{font-size:11px;opacity:.45;margin-top:2px}
.hist-pts{font-size:13px;font-weight:900;text-align:right}

/* ALERT */
.alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
.alert.error{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.2);color:#ff8888}
.alert.success{background:rgba(51,255,153,.08);border:1px solid rgba(51,255,153,.2);color:#33ff99}
.loading{text-align:center;padding:30px;opacity:.4;font-size:13px}
.empty{text-align:center;padding:24px;opacity:.35;font-size:13px}

/* BATTLE LOG */
.battle-log{background:var(--bg2);border-radius:12px;border:1px solid var(--border);padding:12px;max-height:180px;overflow-y:auto;margin-bottom:14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.log-line{font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--muted)}
.log-line:last-child{border-bottom:none}
.log-line.crit{color:var(--gold);font-weight:700}
.log-line.win{color:var(--green);font-weight:700;font-size:13px}
.log-line.lose{color:var(--red);font-weight:700;font-size:13px}
.log-line.turn{color:rgba(255,255,255,.2);font-size:10px;padding-top:6px;letter-spacing:.05em;text-transform:uppercase}

.result-banner{text-align:center;padding:14px;border-radius:12px;font-size:15px;font-weight:900;margin-bottom:12px;display:none}
.result-banner.victory{background:rgba(51,255,153,.1);border:1px solid rgba(51,255,153,.3);color:var(--green)}
.result-banner.defeat{background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);color:var(--red)}
.rank-change{font-size:13px;margin-top:4px;opacity:.7}

/* MODAL REPLAY */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:22px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;transform:scale(.92);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.modal-overlay.show .modal{transform:scale(1)}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}
.modal-title{font-size:16px;font-weight:900;margin-bottom:16px}

/* ── ARENA SPRITES ── */
.arena-stage-wrap{position:relative;margin-bottom:12px}
.arena-hp-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.arena-hp-block{background:var(--bg3);border-radius:10px;padding:10px 12px;border:1px solid var(--border)}
.arena-hp-block.right{text-align:right}
.arena-hp-name{font-size:12px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arena-hp-bar-bg{background:rgba(255,255,255,.06);border-radius:4px;height:6px;overflow:hidden}
.arena-hp-bar{height:6px;border-radius:4px;transition:width .35s ease}
.arena-hp-val{font-size:10px;opacity:.45;margin-top:3px}
.arena-vs{font-size:14px;font-weight:900;opacity:.25;text-align:center}
.arena-stage{position:relative;height:200px;background:linear-gradient(180deg,#06070f 0%,#0a0b18 55%,#0f1020 100%);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.arena-ground{position:absolute;bottom:0;left:0;right:0;height:30px;background:rgba(255,255,255,.025);border-top:1px solid rgba(255,255,255,.05)}
.arena-canvas{position:absolute;bottom:30px;image-rendering:pixelated;image-rendering:crisp-edges}
.dmg-float{position:absolute;font-size:13px;font-weight:900;pointer-events:none;color:#ff6464;opacity:0;transition:none}
.dmg-float.crit{color:var(--gold);font-size:17px}
.dmg-float.anim{animation:dmgPop .75s ease-out forwards}
@keyframes dmgPop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px)}}
</style>
</head>
<body>

<nav class="nav">
  <button class="nav-back" onclick="location.href='/'">← Retour</button>
  <span class="nav-title">⚔️ PVP</span>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('profil',event)">Mon profil</button>
    <button class="tab-btn" onclick="showTab('defier',event)">Défier</button>
    <button class="tab-btn" onclick="showTab('defis',event)" id="defis-tab">Défis <span id="defis-count"></span></button>
    <button class="tab-btn" onclick="showTab('classement',event)">Classement</button>
    <button class="tab-btn" onclick="showTab('historique',event)">Historique</button>
  </div>
</nav>

<div class="page">
  <div id="alert-box" class="alert"></div>

  <div id="sec-profil" class="section active">
    <div class="card">
      <div id="profil-content"><div class="loading">Chargement...</div></div>
    </div>
  </div>

  <div id="sec-defier" class="section">
    <div class="card">
      <div class="card-title">Rechercher un joueur</div>
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Nom du joueur..." maxlength="30" oninput="searchDebounce()">
        <button onclick="searchPlayer()">Chercher</button>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <div id="sec-defis" class="section">
    <div class="card">
      <div class="card-title">Défis en attente</div>
      <div id="defis-content"><div class="loading">Chargement...</div></div>
    </div>
  </div>

  <div id="sec-classement" class="section">
    <div class="card">
      <div class="card-title">Top joueurs</div>
      <div id="lb-content"><div class="loading">Chargement...</div></div>
    </div>
  </div>

  <div id="sec-historique" class="section">
    <div class="card">
      <div class="card-title">Mes combats récents</div>
      <div id="hist-content"><div class="loading">Chargement...</div></div>
    </div>
  </div>
</div>

<!-- MODAL REPLAY -->
<div class="modal-overlay" id="replay-modal" onclick="if(event.target===this) closeReplay()">
  <div class="modal">
    <button class="modal-close" onclick="closeReplay()">✕</button>
    <div class="modal-title" id="replay-title">⚔️ Replay du combat</div>

    <!-- HP bars -->
    <div class="arena-hp-row">
      <div class="arena-hp-block">
        <div class="arena-hp-name" id="rn1">Joueur</div>
        <div class="arena-hp-bar-bg"><div class="arena-hp-bar" id="rhp1" style="width:100%;background:#1D9E75"></div></div>
        <div class="arena-hp-val" id="rhpv1">-</div>
      </div>
      <div class="arena-vs">VS</div>
      <div class="arena-hp-block right">
        <div class="arena-hp-name" id="rn2">Ennemi</div>
        <div class="arena-hp-bar-bg"><div class="arena-hp-bar" id="rhp2" style="width:100%;background:#D85A30"></div></div>
        <div class="arena-hp-val" id="rhpv2">-</div>
      </div>
    </div>

    <!-- Stage -->
    <div class="arena-stage" id="replay-stage">
      <div class="arena-ground"></div>
      <canvas class="arena-canvas" id="rc1"></canvas>
      <canvas class="arena-canvas" id="rc2"></canvas>
      <div class="dmg-float" id="rdmg1"></div>
      <div class="dmg-float" id="rdmg2"></div>
    </div>

    <div class="battle-log" id="replay-log"></div>
    <div class="result-banner" id="replay-result"></div>
    <button style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#7f5cff,#f053c5);color:#fff;font-weight:900;cursor:pointer;font-size:14px" onclick="closeReplay()">Fermer</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONFIG SPRITES — chemin à adapter selon ton serveur
// ═══════════════════════════════════════════════
const SPRITE_PATH = '/spritesheet/'; // <-- mets ici le dossier public de tes sprites

// Chaque classe a ses propres fichiers et frame counts
const CLASS_SPRITES = {
  assassin: {
    idle:    { file:'assassin/Idle.png',     frames:6,  fw:128, fps:8  },
    run:     { file:'assassin/Run.png',      frames:12, fw:128, fps:14 },
    attack1: { file:'assassin/Attack_1.png', frames:4,  fw:128, fps:10 },
    attack2: { file:'assassin/Attack_2.png', frames:3,  fw:128, fps:10 },
    hurt:    { file:'assassin/Hurt.png',     frames:4,  fw:128, fps:10 },
    dead:    { file:'assassin/Dead.png',     frames:4,  fw:128, fps:7  },
    walk:    { file:'assassin/Walk.png',     frames:12, fw:128, fps:12 },
  },
  slayer: {
    idle:    { file:'slayer/Idle.png',     frames:4,  fw:128, fps:7  },
    run:     { file:'slayer/Run.png',      frames:7,  fw:128, fps:12 },
    attack1: { file:'slayer/Attack_1.png', frames:5,  fw:128, fps:10 },
    attack2: { file:'slayer/Attack_2.png', frames:4,  fw:128, fps:10 },
    hurt:    { file:'slayer/Hurt.png',     frames:2,  fw:128, fps:10 },
    dead:    { file:'slayer/Dead.png',     frames:6,  fw:128, fps:7  },
    walk:    { file:'slayer/Walk.png',     frames:8,  fw:128, fps:10 },
  },
  soutien: {
    idle:    { file:'soutien/Idle.png',     frames:8,  fw:128, fps:8  },
    run:     { file:'soutien/Run.png',      frames:8,  fw:128, fps:13 },
    attack1: { file:'soutien/Attack_1.png', frames:7,  fw:128, fps:10 },
    attack2: { file:'soutien/Attack_2.png', frames:9,  fw:128, fps:10 },
    hurt:    { file:'soutien/Hurt.png',     frames:4,  fw:128, fps:10 },
    dead:    { file:'soutien/Dead.png',     frames:4,  fw:128, fps:7  },
    walk:    { file:'soutien/Walk.png',     frames:7,  fw:128, fps:10 },
  },
};

// Fallback si classe inconnue
const DEFAULT_CLASS = 'assassin';

// Cache d'images partagé
const IMG_CACHE = {};
function getImg(src) {
  if (!IMG_CACHE[src]) {
    const img = new Image();
    img.src = SPRITE_PATH + src;
    IMG_CACHE[src] = img;
  }
  return IMG_CACHE[src];
}
// Précharger toutes les classes au démarrage
Object.values(CLASS_SPRITES).forEach(cls => {
  Object.values(cls).forEach(a => getImg(a.file));
});

// ═══════════════════════════════════════════════
// MOTEUR D'ANIMATION ARENA
// ═══════════════════════════════════════════════
const SCALE = 2;
const CW = 128 * SCALE;  // 256px canvas
const CH = 128 * SCALE;  // 256px canvas
const SPRITE_W = 128;    // largeur logique d'un sprite (px dans la scène)
const STAGE_W = 640;     // largeur logique de la scène
const P1_HOME = 20;
const P2_HOME = STAGE_W - 20 - SPRITE_W; // 492

let arenaState = null;  // état courant du combat animé
let arenaRaf = null;
let arenaLastT = 0;

function initArena(cls1, cls2, maxHp1, maxHp2, name1, name2) {
  if (arenaRaf) cancelAnimationFrame(arenaRaf);
  const c1 = document.getElementById('rc1');
  const c2 = document.getElementById('rc2');
  c1.width = CW; c1.height = CH;
  c2.width = CW; c2.height = CH;
  c1.style.width = CW+'px'; c1.style.height = CH+'px';
  c2.style.width = CW+'px'; c2.style.height = CH+'px';

  arenaState = {
    f1: { cls: cls1||DEFAULT_CLASS, x: P1_HOME, anim:'idle', frame:0, tick:0, flip:false, freezeOnEnd:false },
    f2: { cls: cls2||DEFAULT_CLASS, x: P2_HOME, anim:'idle', frame:0, tick:0, flip:true,  freezeOnEnd:false },
    hp1: maxHp1, maxHp1,
    hp2: maxHp2, maxHp2,
    name1, name2,
  };
  updateArenaHp(1, maxHp1, maxHp1);
  updateArenaHp(2, maxHp2, maxHp2);
  document.getElementById('rn1').textContent = name1;
  document.getElementById('rn2').textContent = name2;
  arenaLastT = 0;
  arenaRaf = requestAnimationFrame(arenaLoop);
}

function stopArena() {
  if (arenaRaf) { cancelAnimationFrame(arenaRaf); arenaRaf = null; }
}

function arenaLoop(ts) {
  if (!arenaState) return;
  const dt = arenaLastT ? ts - arenaLastT : 16;
  arenaLastT = ts;
  drawFighter('rc1', arenaState.f1, dt);
  drawFighter('rc2', arenaState.f2, dt);
  positionCanvas('rc1', arenaState.f1, false);
  positionCanvas('rc2', arenaState.f2, true);
  arenaRaf = requestAnimationFrame(arenaLoop);
}

function getAnim(f) {
  const sprites = CLASS_SPRITES[f.cls] || CLASS_SPRITES[DEFAULT_CLASS];
  return sprites[f.anim] || sprites.idle;
}

function drawFighter(canvasId, f, dt) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const a = getAnim(f);
  const img = getImg(a.file);
  if (!img.complete || !img.naturalWidth) { ctx.clearRect(0,0,CW,CH); return; }
  f.tick += dt;
  const interval = 1000 / a.fps;
  if (f.tick >= interval) {
    f.tick -= interval;
    if (f.freezeOnEnd && f.frame >= a.frames - 1) {
      f.frame = a.frames - 1; // bloquer sur dernière frame (dead)
    } else {
      f.frame = (f.frame + 1) % a.frames;
    }
  }
  ctx.clearRect(0, 0, CW, CH);
  ctx.save();
  if (f.flip) { ctx.translate(CW, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, f.frame * a.fw, 0, a.fw, 128, 0, 0, CW, CH);
  ctx.restore();
}

function positionCanvas(canvasId, f, isRight) {
  const el = document.getElementById(canvasId);
  if (!el) return;
  const stage = document.getElementById('replay-stage');
  const sw = stage ? stage.offsetWidth : STAGE_W;
  const ratio = sw / STAGE_W;
  // x logique → pixel écran. P2 a son x depuis la droite, on le convertit en left
  let leftPx;
  if (isRight) {
    // f.x est la distance depuis la droite logique, on retrouve le left réel
    leftPx = Math.round((STAGE_W - f.x - SPRITE_W) * ratio);
  } else {
    leftPx = Math.round(f.x * ratio);
  }
  el.style.left = leftPx + 'px';
  el.style.right = 'auto';
  el.style.width = Math.round(SPRITE_W * ratio * SCALE) + 'px';
  el.style.height = Math.round(128 * ratio * SCALE) + 'px';
}

function setFighterAnim(fid, anim) {
  if (!arenaState) return;
  const f = fid === 1 ? arenaState.f1 : arenaState.f2;
  if (f.anim === anim) return; // déjà sur cette anim
  f.anim = anim;
  f.frame = 0;
  f.tick = 0;
  f.freezeOnEnd = (anim === 'dead'); // bloquer sur dernière frame uniquement pour dead
}

function updateArenaHp(fid, hp, maxHp) {
  const pct = Math.max(0, Math.round(hp / maxHp * 100));
  const bar = document.getElementById('rhp' + fid);
  const val = document.getElementById('rhpv' + fid);
  if (!bar || !val) return;
  const col = pct < 25 ? '#E24B4A' : pct < 50 ? '#EF9F27' : (fid === 1 ? '#1D9E75' : '#D85A30');
  bar.style.width = pct + '%';
  bar.style.background = col;
  val.textContent = Math.max(0, hp) + ' / ' + maxHp;
}

function spawnDmg(fid, dmg, isCrit) {
  const el = document.getElementById('rdmg' + fid);
  if (!el || !arenaState) return;
  const stage = document.getElementById('replay-stage');
  const sw = stage ? stage.offsetWidth : STAGE_W;
  const ratio = sw / STAGE_W;
  const f = fid === 1 ? arenaState.f1 : arenaState.f2;
  const isP2 = fid === 2;
  // Calculer le left pixel du centre du sprite
  let leftPx;
  if (isP2) {
    leftPx = Math.round((STAGE_W - f.x - SPRITE_W + SPRITE_W/2) * ratio) - 20;
  } else {
    leftPx = Math.round((f.x + SPRITE_W/2) * ratio) - 20;
  }
  el.textContent = (isCrit ? 'CRIT ' : '') + '-' + dmg;
  el.className = 'dmg-float' + (isCrit ? ' crit' : '');
  el.style.left = leftPx + 'px';
  el.style.right = 'auto';
  el.style.bottom = '70px';
  el.style.opacity = '0';
  el.style.transform = 'translateY(0)';
  el.style.transition = 'none';
  void el.offsetWidth;
  el.classList.add('anim');
  setTimeout(() => { el.className = 'dmg-float'; }, 800);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// Déplacer un combattant vers une cible X logique
// Pour P1 (isRight=false) : x augmente pour avancer, diminue pour reculer
// Pour P2 (isRight=true)  : x augmente pour avancer vers P1 (car sa pos est depuis la droite), diminue pour reculer
function moveFighter(fid, targetX, speed, animName) {
  return new Promise(resolve => {
    if (!arenaState) { resolve(); return; }
    const f = fid === 1 ? arenaState.f1 : arenaState.f2;
    const isP2 = fid === 2;
    // Ne pas réinitialiser frame si même anim
    if (f.anim !== animName) { f.anim = animName; f.frame = 0; f.tick = 0; f.freezeOnEnd = false; }
    let last = performance.now();
    function step(ts) {
      const dt = Math.min(ts - last, 50); last = ts;
      if (!arenaState) { resolve(); return; }
      if (!isP2) {
        // P1 : x croît vers la droite
        if (targetX > f.x) {
          f.x = Math.min(targetX, f.x + speed * dt / 1000);
        } else {
          f.x = Math.max(targetX, f.x - speed * dt / 1000);
        }
      } else {
        // P2 : x représente la distance depuis la droite, croît pour aller vers P1
        if (targetX > f.x) {
          f.x = Math.min(targetX, f.x + speed * dt / 1000);
        } else {
          f.x = Math.max(targetX, f.x - speed * dt / 1000);
        }
      }
      if (Math.abs(f.x - targetX) < 1) { f.x = targetX; resolve(); return; }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

// ═══════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════
const TOKEN_KEY = 'gacha_token_v1';
const TOKEN = localStorage.getItem(TOKEN_KEY);
if (!TOKEN) location.href = '/login.html';

const RANK_COLORS = { Bronze:'#cd7f32', Argent:'#aaa', Or:'#ffd84d', Platine:'#4da6ff', Diamant:'#c084ff', Maître:'#ff6464' };
const CLASS_EMOJI  = { slayer:'⚔️', assassin:'🗡️', soutien:'🛡️' };

let myData = null;
let searchTimer = null;
let replayBusy = false;

async function api(path, opts={}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers||{}), Authorization:'Bearer '+TOKEN, 'Content-Type':'application/json' } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP '+r.status);
  return d;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtPts(n) { return Number(n||0).toLocaleString(); }
function timeAgo(ts) {
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return 'à l\'instant';
  if (s < 3600) return Math.floor(s/60)+'min';
  if (s < 86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'j';
}

function showAlert(msg, type='error') {
  const el = document.getElementById('alert-box');
  el.textContent = msg; el.className = 'alert '+type; el.style.display='block';
  setTimeout(() => el.style.display='none', 4000);
}

function showTab(name, ev) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  if (ev && ev.target) ev.target.classList.add('active');
  if (name==='profil') loadProfil();
  if (name==='defier') document.getElementById('search-input').focus();
  if (name==='defis') loadDefis();
  if (name==='classement') loadClassement();
  if (name==='historique') loadHistorique();
}

function rankBadgeHtml(rankInfo, pts) {
  const col = RANK_COLORS[rankInfo?.name] || '#aaa';
  return `<span class="rank-badge" style="border-color:${col}33;color:${col}">${rankInfo?.icon||''} ${esc(rankInfo?.name||'Bronze')}<span class="rank-pts">${fmtPts(pts)} pts</span></span>`;
}

async function loadProfil() {
  try {
    const d = await api('/api/pvp/me');
    myData = d.fighter;
    const f = d.fighter;
    document.getElementById('profil-content').innerHTML = `
      <div class="fighter-profile">
        <div class="fighter-avatar">${CLASS_EMOJI[f.charClass]||'🧑'}</div>
        <div class="fighter-info">
          <div class="fighter-name">${esc(f.name)}</div>
          <div class="fighter-meta">Niv. ${f.level} · ${esc(f.classLabel)} · ${f.wins}V ${f.losses}D</div>
          ${rankBadgeHtml(f.rankInfo, f.rank)}
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-box-val" style="color:#ff6464">${f.hp}</div><div class="stat-box-label">PV max</div></div>
        <div class="stat-box"><div class="stat-box-val" style="color:#ffd84d">${f.atq}</div><div class="stat-box-label">Attaque</div></div>
        <div class="stat-box"><div class="stat-box-val" style="color:#c084ff">${f.crit}%</div><div class="stat-box-label">Critique</div></div>
        <div class="stat-box"><div class="stat-box-val" style="color:#4da6ff">${f.dodge}%</div><div class="stat-box-label">Esquive</div></div>
      </div>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;opacity:.35;text-align:center">
        Les stats sont calculées depuis ton personnage, ta classe et ton équipement forgé
      </div>`;
  } catch(e) { document.getElementById('profil-content').innerHTML = '<div class="empty">Erreur chargement profil</div>'; }
}

// ── RECHERCHE ──
function searchDebounce() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchPlayer, 400);
}

async function searchPlayer() {
  const q = document.getElementById('search-input').value.trim();
  const el = document.getElementById('search-results');
  if (q.length < 2) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="loading">Recherche...</div>';
  try {
    const d = await api('/api/pvp/search?name='+encodeURIComponent(q));
    if (!d.users.length) { el.innerHTML = '<div class="empty">Aucun joueur trouvé</div>'; return; }
    el.innerHTML = d.users.map(u => `
      <div class="user-row">
        <div class="user-row-avatar">${CLASS_EMOJI[u.charClass]||'🧑'}</div>
        <div class="user-row-info">
          <div class="user-row-name">${esc(u.name)}</div>
          <div class="user-row-rank" style="color:${RANK_COLORS[u.rankInfo?.name]||'#aaa'}">${u.rankInfo?.icon||''} ${esc(u.rankInfo?.name||'')} · ${fmtPts(u.pts)} pts</div>
        </div>
        <button class="challenge-btn" onclick="sendChallenge(${u.id},'${esc(u.name)}',this)">⚔️ Défier</button>
      </div>`).join('');
  } catch(e) { el.innerHTML = '<div class="empty">Erreur</div>'; }
}

async function sendChallenge(opponentId, name, btn) {
  btn.disabled = true; btn.textContent = '...';
  try {
    await api('/api/pvp/challenge', { method:'POST', body: JSON.stringify({ opponentId }) });
    btn.textContent = '✅ Envoyé';
    showAlert(`Défi envoyé à ${name} !`, 'success');
  } catch(e) {
    btn.disabled = false; btn.textContent = '⚔️ Défier';
    showAlert(e.message, 'error');
  }
}

// ── DÉFIS REÇUS ──
async function loadDefis() {
  const el = document.getElementById('defis-content');
  try {
    const d = await api('/api/pvp/pending');
    const count = d.challenges.length;
    document.getElementById('defis-count').textContent = count > 0 ? `(${count})` : '';
    if (!count) { el.innerHTML = '<div class="empty">Aucun défi en attente</div>'; return; }
    el.innerHTML = d.challenges.map(c => `
      <div class="challenge-card">
        <div class="user-row-avatar">⚔️</div>
        <div class="challenge-card-info">
          <div class="challenge-card-name">${esc(c.challengerName)}</div>
          <div class="challenge-card-sub" style="color:${RANK_COLORS[c.rankInfo?.name]||'#aaa'}">${c.rankInfo?.icon||''} ${esc(c.rankInfo?.name||'')} · il y a ${timeAgo(c.createdAt)}</div>
        </div>
        <div class="challenge-actions">
          <button class="btn-accept" onclick="acceptChallenge(${c.battleId},this)">⚔️ Accepter</button>
          <button class="btn-decline" onclick="declineChallenge(${c.battleId},this)">Refuser</button>
        </div>
      </div>`).join('');
  } catch(e) { el.innerHTML = '<div class="empty">Erreur</div>'; }
}

async function acceptChallenge(battleId, btn) {
  btn.disabled = true; btn.textContent = '...';
  try {
    const d = await api('/api/pvp/accept', { method:'POST', body: JSON.stringify({ battleId }) });
    await loadDefis();
    openReplay(d.log, d.fighters.f1, d.fighters.f2, d.winnerId, d.rankChange);
  } catch(e) {
    btn.disabled = false; btn.textContent = '⚔️ Accepter';
    showAlert(e.message, 'error');
  }
}

async function declineChallenge(battleId, btn) {
  btn.disabled = true;
  try {
    await api('/api/pvp/decline', { method:'POST', body: JSON.stringify({ battleId }) });
    await loadDefis();
  } catch(e) { btn.disabled = false; showAlert(e.message, 'error'); }
}

// ── CLASSEMENT ──
async function loadClassement() {
  const el = document.getElementById('lb-content');
  try {
    const d = await api('/api/pvp/leaderboard');
    if (!d.top.length) { el.innerHTML = '<div class="empty">Aucun classement disponible</div>'; return; }
    el.innerHTML = d.top.map(u => {

      const isMe = myData && u.name === myData.name;
      return `<div class="lb-row ${isMe?'me':''}">
        <div class="lb-rank-num" style="color:${u.rank<=3?'#ffd84d':''}">${u.rank<=3?['🥇','🥈','🥉'][u.rank-1]:u.rank}</div>
        <div class="lb-avatar">${CLASS_EMOJI[u.charClass]||'🧑'}</div>
        <div style="flex:1">
          <div class="lb-name">${esc(u.name)}</div>
          <div class="lb-stats">${u.wins}V ${u.losses}D</div>
        </div>
        <div>
          <div class="lb-pts" style="color:${col}">${fmtPts(u.pts)}</div>
          <div class="lb-rank-badge" style="color:${col}">${u.rankInfo?.icon||''} ${esc(u.rankInfo?.name||'')}</div>
        </div>
      </div>`;
    }).join('');
  } catch(e) { el.innerHTML = '<div class="empty">Erreur</div>'; }

// ── HISTORIQUE ──
async function loadHistorique() {
  const el = document.getElementById('hist-content');
  try {
    const d = await api('/api/pvp/history');
    if (!d.history.length) { el.innerHTML = '<div class="empty">Aucun combat pour l\'instant</div>'; return; }
    el.innerHTML = d.history.map(h => `
      <div class="hist-row" onclick="loadReplay(${h.battleId})">
        <div class="hist-result">${h.won?'🏆':'💀'}</div>
        <div class="hist-info">
          <div class="hist-vs">vs ${esc(h.opponentName)}</div>
          <div class="hist-sub">il y a ${timeAgo(h.at)} · Cliquer pour revoir</div>
        </div>
        <div class="hist-pts" style="color:${h.won?'#33ff99':'#ff6464'}">${h.won?'+':''}${h.rankChange} pts</div>
      </div>`).join('');
  } catch(e) { el.innerHTML = '<div class="empty">Erreur</div>'; }
}

async function loadReplay(battleId) {
  try {
    const d = await api('/api/pvp/result/'+battleId);
    const b = d.battle;
    const f1 = { name: b.challengerName, charClass: b.challengerClass||'assassin', hp: getMaxHp(b.log, b.challengerName) };
    const f2 = { name: b.opponentName,   charClass: b.opponentClass||'assassin',   hp: getMaxHp(b.log, b.opponentName)   };
    openReplay(b.log, f1, f2, b.winnerId, b.rankChange);
  } catch(e) { showAlert(e.message); }
}

function getMaxHp(log, name) {
  for (const e of log) {
    if ((e.type==='hit'||e.type==='crit') && e.defender===name) return e.hpMax;
  }
  return 300;
}

// ═══════════════════════════════════════════════
// REPLAY ANIMÉ
// ═══════════════════════════════════════════════
function openReplay(log, f1, f2, winnerId, rankChange) {
  if (replayBusy) return;
  replayBusy = true;

  const modal = document.getElementById('replay-modal');
  document.getElementById('replay-title').textContent = `⚔️ ${f1.name} vs ${f2.name}`;
  document.getElementById('replay-log').innerHTML = '';
  document.getElementById('replay-result').style.display = 'none';
  modal.classList.add('show');

  // Attendre que le modal soit visible pour mesurer le stage
  setTimeout(() => {
    initArena(
      f1.charClass, f2.charClass,
      f1.hp, f2.hp,
      f1.name, f2.name
    );
    playReplay(log, f1, f2, winnerId, rankChange);
  }, 350);
}

function closeReplay() {
  document.getElementById('replay-modal').classList.remove('show');
  stopArena();
  replayBusy = false;
}

async function playReplay(log, f1, f2, winnerId, rankChange) {
  const logEl = document.getElementById('replay-log');

  function addLog(text, cls='') {
    const d = document.createElement('div');
    d.className = 'log-line ' + cls;
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Positions logiques
  // P1 avance vers la droite, s'arrête avant P2
  // P2 : sa x est sa distance depuis la droite, il avance en augmentant x
  // Contact = quand P1.left + SPRITE_W == P2.left → P2_HOME - SPRITE_W
  const GAP = 10; // pixels de gap entre les deux sprites
  const P1_ATTACK_X = P2_HOME - SPRITE_W - GAP;   // P1 s'arrête juste à gauche de P2
  const P2_ATTACK_X = P1_HOME + SPRITE_W + GAP;    // P2 s'arrête juste à droite de P1 (en valeur "depuis droite")

  await wait(300);

  for (let i = 0; i < log.length; i++) {
    const ev = log[i];
    if (!arenaState) break;

    if (ev.type === 'turn') {
      if (ev.turn > 1) addLog('— Tour ' + ev.turn + ' —', 'turn');
      continue;
    }

    if (ev.type === 'dodge') {
      addLog((ev.defender === f1.name ? f1.name : f2.name) + ' esquive !');
      await wait(350);
      continue;
    }

    if (ev.type === 'hit' || ev.type === 'crit') {
      const isF1att = ev.attacker === f1.name;
      const attId = isF1att ? 1 : 2;
      const defId = isF1att ? 2 : 1;

      // Courir vers l'ennemi
      if (isF1att) {
        await moveFighter(1, P1_ATTACK_X, 420, 'run');
      } else {
        await moveFighter(2, P2_ATTACK_X, 420, 'run');
      }

      // Attaque
      setFighterAnim(attId, ev.type === 'crit' ? 'attack2' : 'attack1');
      await wait(160);

      // Défenseur prend le coup
      setFighterAnim(defId, 'hurt');
      spawnDmg(defId, ev.dmg, ev.type === 'crit');

      // Mise à jour HP
      if (isF1att) {
        arenaState.hp2 = ev.hpLeft;
        updateArenaHp(2, ev.hpLeft, ev.hpMax);
      } else {
        arenaState.hp1 = ev.hpLeft;
        updateArenaHp(1, ev.hpLeft, ev.hpMax);
      }

      addLog(ev.attacker + ' → ' + ev.dmg + ' dégâts' + (ev.type==='crit' ? ' (CRITIQUE!)' : ''), ev.type==='crit'?'crit':'');
      await wait(320);

      // Retour en position idle
      setFighterAnim(defId, 'idle');
      if (isF1att) {
        await moveFighter(1, P1_HOME, 300, 'walk');
      } else {
        await moveFighter(2, P2_HOME, 300, 'walk');
      }
      setFighterAnim(attId, 'idle');
      await wait(150);
    }

    if (ev.type === 'end') {
      const playerWon = myData && (
        (ev.winner === f1.name && f1.name === myData.name) ||
        (ev.winner === f2.name && f2.name === myData.name)
      );
      const loserId = ev.winner === f1.name ? 2 : 1;
      setFighterAnim(loserId, 'dead');
      await wait(700);

      addLog(ev.winner + ' remporte le combat !', playerWon ? 'win' : 'lose');
      const banner = document.getElementById('replay-result');
      banner.className = 'result-banner ' + (playerWon ? 'victory' : 'defeat');
      banner.style.display = 'block';
      if (playerWon) {
        banner.innerHTML = `🏆 Victoire !<div class="rank-change">+${rankChange||'?'} pts de rang</div>`;
      } else {
        banner.innerHTML = `💀 Défaite<div class="rank-change">${rankChange ? '-'+rankChange : ''} pts de rang</div>`;
      }
    }
  }
  replayBusy = false;
}
