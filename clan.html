<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clan — Gachax</title>
<style>
:root{
  --bg1:#05060d;--bg2:#090b18;
  --accent:#7f5cff;--accent2:#f053c5;
  --gold:#ffd84d;--red:#ff4444;--green:#33ff99;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto;color:#fff;overflow-x:hidden}
body{
  background:
    radial-gradient(900px 520px at 20% 10%,rgba(80,130,255,.22),transparent 60%),
    radial-gradient(900px 600px at 85% 30%,rgba(255,80,220,.18),transparent 62%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;
  background:rgba(5,6,13,.85);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
}
.topbar a{color:#fff;text-decoration:none;font-weight:800;font-size:13px;opacity:.8}
.topbar a:hover{opacity:1}
.topNav{display:flex;gap:14px;align-items:center}
.topLink{
  padding:8px 10px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  color:#fff;font-size:12px;font-weight:900;text-decoration:none;
  transition:background .12s;white-space:nowrap;
}
.topLink:hover{background:rgba(255,255,255,.14)}
.cornerLogo{width:70px;flex:0 0 auto}
.cornerLogo img{width:100%;height:auto;display:block}

/* LAYOUT */
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px}

/* CARDS */
.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);
  border-radius:18px;padding:20px;
}
.card-title{font-size:15px;font-weight:900;letter-spacing:.05em;margin:0 0 16px;opacity:.9}

/* BUTTONS */
.btn{
  padding:10px 18px;border-radius:12px;border:none;cursor:pointer;
  font-weight:800;font-size:13px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  transition:opacity .15s,transform .12s;
}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn-danger{background:linear-gradient(135deg,#ff4444,#ff6b6b)}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.btn-gold{background:linear-gradient(135deg,#ffd84d,#ff8800)}

/* INPUTS */
input,textarea,select{
  width:100%;padding:10px 14px;border-radius:10px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);
  color:#fff;font-size:14px;font-weight:600;
  outline:none;
}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{font-size:12px;opacity:.7;display:block;margin-bottom:4px}

/* TABS */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{
  padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:800;font-size:13px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  transition:all .15s;
}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.tab:hover:not(.active){background:rgba(255,255,255,.12)}

/* CLAN BANNER */
.clan-banner{
  border-radius:18px;padding:24px;
  background:linear-gradient(135deg,var(--bannerColor,#7f5cff)44,rgba(0,0,0,.4));
  border:1px solid rgba(255,255,255,.15);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.clan-logo{
  width:80px;height:80px;border-radius:16px;
  background-size:cover;background-position:center;
  border:2px solid rgba(255,255,255,.2);
  flex-shrink:0;
}
.clan-tag{
  font-size:28px;font-weight:900;letter-spacing:.1em;
  background:rgba(0,0,0,.35);border-radius:10px;padding:8px 16px;
}
.clan-info{flex:1;min-width:200px}
.clan-name{font-size:22px;font-weight:900;margin:0 0 4px}
.clan-desc{opacity:.75;font-size:14px;margin:0 0 10px}
.clan-stats{display:flex;gap:14px;flex-wrap:wrap}
.cstat{font-size:13px;opacity:.85}
.cstat b{color:var(--gold)}

/* BOSS */
.boss-card{
  background:linear-gradient(135deg,rgba(255,50,50,.12),rgba(200,0,0,.06));
  border:1px solid rgba(255,80,80,.25);
  border-radius:18px;padding:20px;
}
.boss-name{font-size:18px;font-weight:900;color:#ff6060;margin:0 0 12px}
.hp-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:14px;overflow:hidden;margin:8px 0}
.hp-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#ff4444,#ff8800);transition:width .5s ease}
.hp-text{font-size:13px;opacity:.8;margin-bottom:8px}
.dmg-leaderboard{margin-top:14px}
.dmg-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.dmg-row:last-child{border:none}
.dmg-me{color:var(--gold);font-weight:800}

/* MEMBERS */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.member-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;
}
.member-avatar{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0;
  background-size:cover;background-position:center;
}
.member-name{font-weight:800;font-size:13px}
.member-role{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.05em}
.member-dmg{font-size:11px;color:var(--gold);margin-top:2px}
.role-leader{color:#ffd84d}
.role-officer{color:#a0c4ff}

/* MISSIONS */
.missions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mission-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:12px;padding:14px;
}
.mission-label{font-size:13px;font-weight:800;margin-bottom:8px}
.mission-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:8px;overflow:hidden;margin:6px 0}
.mission-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.mission-bar.done{background:linear-gradient(90deg,#33ff99,#00c88c)}
.mission-prog{font-size:12px;opacity:.7}
.mission-reward{font-size:11px;color:var(--gold);margin-top:4px}
.mission-check{font-size:18px;float:right;margin-top:-2px}

/* CHAT */
.chat-messages{
  height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  padding:12px;background:rgba(0,0,0,.25);border-radius:12px;margin-bottom:12px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;
}
.chat-msg{display:flex;gap:8px;align-items:flex-start}
.chat-avatar{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:900;font-size:12px;
  background-size:cover;background-position:center;
}
.chat-body{min-width:0}
.chat-author{font-size:12px;font-weight:800;opacity:.85}
.chat-text{font-size:13px;word-break:break-word;margin-top:2px;opacity:.9}
.chat-time{font-size:10px;opacity:.45;margin-top:2px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1}

/* BANK */
.bank-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.bank-row input{flex:1;min-width:120px}
.bank-select{flex:1;min-width:120px}

/* CLAN LIST */
.clan-list{display:grid;gap:12px}
.clan-list-item{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:14px;
}
.clan-list-tag{
  font-size:16px;font-weight:900;letter-spacing:.08em;
  background:rgba(255,255,255,.08);border-radius:8px;
  padding:6px 10px;flex-shrink:0;min-width:55px;text-align:center;
}
.clan-list-info{flex:1;min-width:0}
.clan-list-name{font-weight:800;font-size:14px}
.clan-list-sub{font-size:12px;opacity:.6;margin-top:2px}
.clan-list-xp{font-size:12px;color:var(--gold);margin-top:2px}

/* CREATE FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}

/* ALERTS */
.alert{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:12px}
.alert-error{background:rgba(255,68,68,.15);border:1px solid rgba(255,68,68,.3);color:#ff8888}
.alert-success{background:rgba(51,255,153,.1);border:1px solid rgba(51,255,153,.3);color:#33ff99}

/* LEADERBOARD */
.lb-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:6px;
}
.lb-rank{font-size:16px;font-weight:900;min-width:28px;text-align:center}
.lb-rank.gold{color:var(--gold)}
.lb-rank.silver{color:#c0c0c0}
.lb-rank.bronze{color:#cd7f32}
.lb-name{flex:1;font-weight:800;font-size:14px}
.lb-xp{color:var(--gold);font-size:13px;font-weight:800}

/* LOADING */
.loading{opacity:.5;text-align:center;padding:40px;font-size:14px}

/* COLOR PICKER */
.color-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-opt{
  width:28px;height:28px;border-radius:999px;cursor:pointer;
  border:2px solid transparent;transition:border-color .15s;
}
.color-opt.selected{border-color:#fff}

/* MOBILE */
@media(max-width:768px){
  .clan-banner{flex-direction:column;align-items:flex-start}
  .members-grid{grid-template-columns:1fr 1fr}
  .missions-grid{grid-template-columns:1fr}
}

/* DEFEATED BOSS */
.boss-defeated{
  text-align:center;padding:30px;
  color:var(--green);font-weight:900;font-size:18px;
}
.no-clan-wrap{text-align:center;padding:60px 20px}
.no-clan-wrap h2{margin:0 0 10px;font-size:22px}
.no-clan-wrap p{opacity:.7;margin:0 0 24px}

/* RAID */
.raid-select-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px}
@media(max-width:800px){.raid-select-grid{grid-template-columns:1fr}}
.boss-choice{
  border:2px solid rgba(255,255,255,.12);border-radius:16px;
  padding:16px;text-align:center;
  background:rgba(255,255,255,.04);
  transition:border-color .2s,background .2s,transform .15s;
}
.boss-choice.available:hover{border-color:rgba(255,80,80,.5);background:rgba(255,80,80,.08);transform:translateY(-2px)}
.boss-choice.locked{opacity:.5;cursor:not-allowed}
.boss-choice img{width:100%;max-height:140px;object-fit:contain;border-radius:10px;margin-bottom:10px}
.boss-choice .boss-choice-name{font-size:16px;font-weight:900;margin-bottom:4px}
.boss-choice .boss-choice-stats{font-size:12px;opacity:.7;line-height:1.6}
.diff-btns{display:flex;gap:8px;margin-top:10px;justify-content:center}
.diff-btn{flex:1;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;border:2px solid;transition:all .15s}
.diff-btn.easy{border-color:rgba(100,255,150,.4);background:rgba(100,255,150,.08);color:#64ff96}
.diff-btn.easy:hover{background:rgba(100,255,150,.18)}
.diff-btn.hard{border-color:rgba(255,80,80,.4);background:rgba(255,80,80,.08);color:#ff5050}
.diff-btn.hard:hover{background:rgba(255,80,80,.18)}
.diff-btn:disabled{opacity:.4;cursor:not-allowed}
.cooldown-badge{margin-top:8px;font-size:11px;color:#ffd84d;opacity:.8}

.stock-bar{
  background:rgba(255,255,255,.06);border:1px solid rgba(127,92,255,.3);
  border-radius:12px;padding:14px 16px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.stock-val{font-size:22px;font-weight:900;color:var(--accent)}
.stock-label{font-size:13px;opacity:.7}

/* Animation attaque */
@keyframes attackShake {
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-8px) rotate(-2deg)}
  30%{transform:translateX(8px) rotate(2deg)}
  45%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}
  75%{transform:translateX(-3px)}
}
@keyframes attackFlash {
  0%{opacity:0;transform:scale(.5)}
  20%{opacity:1;transform:scale(1.2)}
  100%{opacity:0;transform:scale(2)}
}
@keyframes dmgPop {
  0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  30%{opacity:1;transform:translate(-50%,-120%) scale(1.2)}
  100%{opacity:0;transform:translate(-50%,-200%) scale(.8)}
}
.boss-img-wrap{position:relative;display:inline-block}
.attack-flash{
  position:absolute;inset:0;border-radius:14px;
  background:radial-gradient(circle,rgba(255,80,80,.9),transparent 70%);
  pointer-events:none;opacity:0;
}
.dmg-popup{
  position:absolute;left:50%;top:50%;
  font-size:28px;font-weight:900;color:#ff4444;
  text-shadow:0 0 20px rgba(255,68,68,.8);
  pointer-events:none;white-space:nowrap;
  animation:dmgPop .9s ease forwards;
}
.timer-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:6px;overflow:hidden;margin:6px 0}
.timer-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#33ff99,#ffd84d,#ff4444);transition:width 1s linear}
.talent-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;padding:14px 18px;
  background:rgba(127,92,255,.1);border:1px solid rgba(127,92,255,.25);
  border-radius:12px;flex-wrap:wrap;gap:10px;
}
.talent-points-badge{
  font-size:20px;font-weight:900;color:var(--gold);
}
.clan-xp-bar-wrap{flex:1;min-width:200px}
.clan-xp-bar-label{font-size:12px;opacity:.7;margin-bottom:4px}
.clan-xp-bar{background:rgba(255,255,255,.1);border-radius:999px;height:8px;overflow:hidden}
.clan-xp-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}

.talents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.talent-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  border-radius:14px;padding:16px;
}
.talent-card.maxed{border-color:rgba(255,216,77,.3);background:rgba(255,216,77,.06)}
.talent-icon{font-size:28px;margin-bottom:8px}
.talent-name{font-size:15px;font-weight:900;margin-bottom:4px}
.talent-desc{font-size:12px;opacity:.65;margin-bottom:12px}
.talent-levels{display:flex;gap:4px;margin-bottom:10px}
.talent-dot{
  width:18px;height:18px;border-radius:999px;
  border:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  transition:background .2s;
}
.talent-dot.filled{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.talent-dot.maxed{background:linear-gradient(135deg,#ffd84d,#ff8800);border-color:transparent}
.talent-current{font-size:12px;color:var(--green);margin-bottom:4px}
.talent-next{font-size:12px;opacity:.6;margin-bottom:10px}
.talent-cost{font-size:12px;color:var(--gold);margin-bottom:8px}

.section-hidden{display:none}

/* PERSONNAGE */
.char-wrap{display:flex;flex-direction:column;gap:16px}

/* === CARTE HERO === */
.char-hero-card{
  border-radius:20px;overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(10,10,20,.6);
  display:flex;flex-direction:column;
}
.char-hero-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center top;
  opacity:.18;filter:blur(2px);transform:scale(1.05);
  transition:opacity .4s;
}
.char-hero-top{
  position:relative;z-index:1;
  display:flex;gap:0;min-height:220px;
}
.char-hero-img-col{
  width:180px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;
  padding:0 0 0 16px;
}
.char-hero-img{
  width:160px;height:210px;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 0 24px var(--cls-color,#7f5cff));
  transition:filter .4s,transform .3s;
}
.char-hero-img:hover{transform:scale(1.04) translateY(-4px)}
.char-hero-img-placeholder{
  width:160px;height:210px;display:flex;align-items:center;justify-content:center;
  font-size:80px;filter:drop-shadow(0 0 24px var(--cls-color,#7f5cff));
}
.char-hero-info-col{
  flex:1;padding:24px 20px 20px;display:flex;flex-direction:column;justify-content:space-between;
}
.char-hero-name{font-size:22px;font-weight:900;margin-bottom:4px}
.char-class-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;margin-bottom:14px;
  border:1px solid;
}
.char-class-pill.no-class{
  background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff;opacity:.7;
}
.char-level-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.char-level-num{font-size:36px;font-weight:900;line-height:1}
.char-level-label{font-size:13px;opacity:.6;font-weight:700}
.char-xp-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:8px;overflow:hidden;margin-bottom:5px}
.char-xp-bar{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.char-xp-label{font-size:11px;opacity:.6}
.char-passive-row{
  margin-top:14px;padding:10px 14px;border-radius:10px;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);
  font-size:12px;line-height:1.7;
}
.char-passive-title{font-size:11px;font-weight:900;opacity:.5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}

/* Points badge flottant */
.char-points-float{
  position:absolute;top:14px;right:14px;z-index:2;
  background:linear-gradient(135deg,#ffd84d,#ff8800);
  border-radius:12px;padding:8px 14px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(255,216,77,.35);
  animation:pointsPulse 2s ease infinite;
}
@keyframes pointsPulse{0%,100%{box-shadow:0 4px 20px rgba(255,216,77,.35)}50%{box-shadow:0 4px 32px rgba(255,216,77,.6)}}
.char-points-float-num{font-size:20px;font-weight:900;color:#000}
.char-points-float-label{font-size:11px;font-weight:800;color:rgba(0,0,0,.7)}

/* Barre XP bottom */
.char-hero-xp-bar-full{
  position:relative;z-index:1;
  height:6px;background:rgba(255,255,255,.08);
}
.char-hero-xp-bar-fill{
  height:100%;transition:width .6s cubic-bezier(.4,0,.2,1);
}

/* === CHOIX DE CLASSE === */
.class-pick-screen{
  border-radius:20px;padding:28px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  text-align:center;
}
.class-pick-title{font-size:20px;font-weight:900;margin-bottom:6px}
.class-pick-sub{font-size:13px;opacity:.6;margin-bottom:24px}
.class-cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.class-cards-row{grid-template-columns:1fr}}
.class-pick-card{
  border-radius:16px;padding:20px 14px;cursor:pointer;
  border:2px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  transition:all .2s;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.class-pick-card:hover{transform:translateY(-4px);border-color:var(--cls-color)!important;background:rgba(255,255,255,.08)}
.class-pick-card.selected{border-color:var(--cls-color)!important;background:rgba(255,255,255,.1)}
.class-pick-img{width:110px;height:145px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 16px var(--cls-color))}
.class-pick-img-ph{font-size:56px;height:110px;display:flex;align-items:flex-end;justify-content:center}
.class-pick-name{font-size:16px;font-weight:900}
.class-pick-desc{font-size:11px;opacity:.6;line-height:1.5}
.class-pick-passives{

.class-pick-btn{

/* === STATS === */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.stats-grid{grid-template-columns:1fr}}
.stat-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);

}
.stat-card.force  {border-color:rgba(255,100,100,.3);background:rgba(255,80,80,.06)}
.stat-card.agilite{border-color:rgba(100,255,150,.3);background:rgba(51,255,153,.06)}
.stat-card.intel  {border-color:rgba(100,180,255,.3);background:rgba(77,166,255,.06)}
.stat-card.dex    {border-color:rgba(255,216,77,.3);background:rgba(255,216,77,.06)}
.stat-icon{font-size:22px;margin-bottom:4px}
.stat-name{font-size:13px;font-weight:900;margin-bottom:2px}
.stat-desc{font-size:11px;opacity:.55;margin-bottom:10px;line-height:1.5}
.stat-value-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:900}
.stat-bonus{font-size:11px;opacity:.65}
.stat-passive-line{font-size:10px;opacity:.5;margin-bottom:6px;font-style:italic}
.stat-dots{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:10px}
.stat-dot{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.12)}
.stat-dot.filled.force  {background:#ff6464}
.stat-dot.filled.agilite{background:#33ff99}
.stat-dot.filled.intel  {background:#4da6ff}
.stat-dot.filled.dex    {background:#ffd84d}
.stat-alloc-btn{

}
.stat-alloc-btn:hover:not(:disabled){background:rgba(255,255,255,.2);transform:translateY(-1px)}
.stat-alloc-btn:disabled{opacity:.35;cursor:not-allowed}
.stat-alloc-btn.force  {background:rgba(255,80,80,.25);border-color:rgba(255,80,80,.4)}
.stat-alloc-btn.force:hover:not(:disabled){background:rgba(255,80,80,.4)}
.stat-alloc-btn.agilite{background:rgba(51,255,153,.2);border-color:rgba(51,255,153,.35)}
.stat-alloc-btn.agilite:hover:not(:disabled){background:rgba(51,255,153,.35)}
.stat-alloc-btn.intel  {background:rgba(77,166,255,.2);border-color:rgba(77,166,255,.35)}
.stat-alloc-btn.intel:hover:not(:disabled){background:rgba(77,166,255,.35)}
.stat-alloc-btn.dex    {background:rgba(255,216,77,.2);border-color:rgba(255,216,77,.35)}
.stat-alloc-btn.dex:hover:not(:disabled){background:rgba(255,216,77,.35)}
.char-xp-table{width:100%;border-collapse:collapse;font-size:13px}
.char-xp-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.char-xp-table tr:last-child td{border:none}
.char-xp-table .boss-cell{font-weight:800}
.char-xp-table .xp-cell{color:var(--gold);font-weight:800;text-align:right}

/* DECK */
.raid-card{
  border-radius:12px;border:2px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);cursor:pointer;
  transition:transform .15s,border-color .15s;
  overflow:hidden;position:relative;
}
.raid-card:hover{transform:translateY(-3px);border-color:rgba(127,92,255,.5)}
.raid-card.in-deck{border-color:rgba(127,92,255,.8);box-shadow:0 0 12px rgba(127,92,255,.3)}
.raid-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.raid-card .rc-name{font-size:11px;font-weight:800;padding:5px 6px;text-align:center;line-height:1.3}
.raid-card .rc-rarity{position:absolute;top:5px;right:5px;font-size:11px;padding:2px 6px;border-radius:999px;font-weight:800}
.rc-rarity.common{background:rgba(180,180,180,.3);color:#ccc}
.rc-rarity.rare{background:rgba(77,166,255,.3);color:#4da6ff}
.rc-rarity.epic{background:rgba(192,132,255,.3);color:#c084ff}
.rc-rarity.legendary{background:rgba(255,216,77,.3);color:#ffd84d}
.raid-card .rc-type{position:absolute;top:5px;left:5px;font-size:13px}

.deck-slot{
  width:100px;height:145px;border-radius:12px;
  border:2px dashed rgba(255,255,255,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .15s;position:relative;overflow:hidden;
  background:rgba(255,255,255,.03);flex-shrink:0;
}
.deck-slot.filled{border-style:solid;border-color:rgba(127,92,255,.6)}
.deck-slot:hover{border-color:rgba(127,92,255,.5)}
.deck-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:10px}
.deck-slot .slot-label{font-size:11px;opacity:.5;z-index:1}
.deck-slot .slot-name{font-size:9px;font-weight:800;position:absolute;bottom:4px;left:0;right:0;text-align:center;z-index:2;background:rgba(0,0,0,.6);padding:2px}
.deck-slot .slot-remove{position:absolute;top:3px;right:3px;z-index:3;background:rgba(255,60,60,.8);border-radius:999px;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}

.bonus-recap{
  background:rgba(127,92,255,.08);border:1px solid rgba(127,92,255,.2);
  border-radius:12px;padding:12px 16px;font-size:13px;
}
.bonus-recap .bonus-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.bonus-tag{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(255,255,255,.08)}

.card-tooltip{
  position:fixed;z-index:9999;background:#1a1a2e;border:1px solid rgba(127,92,255,.4);
  border-radius:12px;padding:10px 14px;font-size:12px;max-width:280px;pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}

/* Zoom modal carte de raid */
.raid-card-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99999;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.raid-card-modal-inner{
  background:#12132a;border:1px solid rgba(127,92,255,.3);
  border-radius:20px;padding:20px;max-width:340px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  display:flex;gap:16px;align-items:flex-start;
}
.raid-card-modal-img{
  width:140px;flex-shrink:0;border-radius:12px;overflow:hidden;border:2px solid rgba(127,92,255,.3);
}
.raid-card-modal-img img{width:100%;display:block;}
.raid-card-modal-info{flex:1;min-width:0;}
.raid-card-modal-name{font-size:16px;font-weight:900;margin-bottom:4px;}
.raid-card-modal-type{font-size:12px;opacity:.7;margin-bottom:10px;}
.raid-card-modal-stat{font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.raid-card-modal-close{
  position:absolute;top:12px;right:16px;font-size:20px;cursor:pointer;
  opacity:.6;transition:opacity .15s;
}
.raid-card-modal-close:hover{opacity:1;}
@media(max-width:500px){
  .raid-card-modal-inner{flex-direction:column;align-items:center;}
  .raid-card-modal-img{width:120px;}
}

/* ── ÉQUIPEMENT RPG ─────────────────────────── */
/* ── PAGE PERSONNAGE LAYOUT ── */
.perso-page{ display:flex; flex-direction:column; gap:16px; }

  display:grid;
  grid-template-columns:1fr auto 1fr;

  overflow:hidden;
}
.perso-col-left{
  display:flex;flex-direction:column;justify-content:center;gap:8px;
  padding:10px 8px;border-right:1px solid rgba(255,255,255,.06);
}
.perso-col-center{
  display:flex;flex-direction:column;align-items:center;width:220px;
  background:rgba(0,0,0,.18);
}

  width:100%;padding:10px 12px 6px;

}
.perso-xp-level{display:flex;align-items:baseline;gap:6px;margin-bottom:5px;}
.perso-xp-lvl-num{font-size:22px;font-weight:1000;}
.perso-xp-lvl-max{font-size:12px;opacity:.5;}
.perso-xp-bar{height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:3px;}

.perso-xp-txt{font-size:10px;opacity:.45;text-align:center;}

.eq-slot{

.eq-slot:hover{background:rgba(127,92,255,.10);border-color:rgba(127,92,255,.4);}

.eq-slot.filled.legendary{border-color:rgba(255,184,0,.4);background:rgba(255,184,0,.05);}
.eq-slot.filled.epic{border-color:rgba(192,132,255,.4);background:rgba(192,132,255,.05);}
.eq-slot.filled.rare{border-color:rgba(77,166,255,.4);background:rgba(77,166,255,.05);}
.eq-slot-img{width:30px;height:30px;object-fit:contain;border-radius:6px;flex-shrink:0;}
.eq-slot-empty-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.3;flex-shrink:0;}
.eq-slot-info{min-width:0;flex:1;}
.eq-slot-label{font-size:8px;color:rgba(255,255,255,.35);font-weight:900;letter-spacing:.06em;text-transform:uppercase;}
.eq-slot-name{font-size:10px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.eq-slot-stats{font-size:9px;color:rgba(255,255,255,.4);margin-top:2px;}
.eq-slot-unequip{position:absolute;top:3px;right:5px;font-size:10px;opacity:.3;cursor:pointer;padding:2px 4px;border-radius:4px;}
.eq-slot-unequip:hover{opacity:.8;background:rgba(255,80,80,.2);}
.perso-bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.perso-inventory{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;}
.perso-inv-title{font-size:12px;font-weight:900;opacity:.65;margin-bottom:10px;}
.eq-inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;max-height:260px;overflow-y:auto;}
.eq-inv-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:7px 5px;text-align:center;cursor:pointer;transition:all .15s;position:relative;}
.eq-inv-item:hover{background:rgba(127,92,255,.15);border-color:rgba(127,92,255,.4);transform:translateY(-2px);}
.eq-inv-item.equipped{border-color:rgba(51,255,153,.4);background:rgba(51,255,153,.05);}
.eq-inv-item.legendary{border-color:rgba(255,184,0,.35);}
.eq-inv-item.epic{border-color:rgba(192,132,255,.3);}
.eq-inv-item.rare{border-color:rgba(77,166,255,.3);}
.eq-inv-img{width:44px;height:44px;object-fit:contain;}
.eq-inv-name{font-size:9px;color:rgba(255,255,255,.65);margin-top:3px;font-weight:900;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.eq-equipped-badge{position:absolute;top:3px;right:3px;width:7px;height:7px;background:#33ff99;border-radius:50%;}
.perso-bonus{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;}
.perso-bonus-title{font-size:12px;font-weight:900;opacity:.65;margin-bottom:2px;}
.perso-bonus-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:10px;}
.perso-bonus-label{font-size:11px;opacity:.6;}
.perso-bonus-val{font-size:16px;font-weight:1000;}
.perso-bonus-detail{font-size:9px;opacity:.4;margin-top:1px;}
.perso-stats{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;}
.perso-stats-title{font-size:12px;font-weight:900;opacity:.65;margin-bottom:10px;}
.perso-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:700px){
  .perso-main{grid-template-columns:1fr;}

/* ALERTS */
.alert{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:12px}
.alert-error{background:rgba(255,68,68,.15);border:1px solid rgba(255,68,68,.3);color:#ff8888}
.alert-success{background:rgba(51,255,153,.1);border:1px solid rgba(51,255,153,.3);color:#33ff99}

/* LEADERBOARD */
.lb-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:6px;
}
.lb-rank{font-size:16px;font-weight:900;min-width:28px;text-align:center}
.lb-rank.gold{color:var(--gold)}
.lb-rank.silver{color:#c0c0c0}
.lb-rank.bronze{color:#cd7f32}
.lb-name{flex:1;font-weight:800;font-size:14px}
.lb-xp{color:var(--gold);font-size:13px;font-weight:800}

/* LOADING */
.loading{opacity:.5;text-align:center;padding:40px;font-size:14px}

/* COLOR PICKER */
.color-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-opt{
  width:28px;height:28px;border-radius:999px;cursor:pointer;
  border:2px solid transparent;transition:border-color .15s;
}
.color-opt.selected{border-color:#fff}

/* MOBILE */
@media(max-width:768px){
  .clan-banner{flex-direction:column;align-items:flex-start}
  .members-grid{grid-template-columns:1fr 1fr}
  .missions-grid{grid-template-columns:1fr}
}

/* DEFEATED BOSS */
.boss-defeated{
  text-align:center;padding:30px;
  color:var(--green);font-weight:900;font-size:18px;
}
.no-clan-wrap{text-align:center;padding:60px 20px}
.no-clan-wrap h2{margin:0 0 10px;font-size:22px}
.no-clan-wrap p{opacity:.7;margin:0 0 24px}

/* RAID */
.raid-select-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px}
@media(max-width:800px){.raid-select-grid{grid-template-columns:1fr}}
.boss-choice{
  border:2px solid rgba(255,255,255,.12);border-radius:16px;
  padding:16px;text-align:center;
  background:rgba(255,255,255,.04);
  transition:border-color .2s,background .2s,transform .15s;
}
.boss-choice.available:hover{border-color:rgba(255,80,80,.5);background:rgba(255,80,80,.08);transform:translateY(-2px)}
.boss-choice.locked{opacity:.5;cursor:not-allowed}
.boss-choice img{width:100%;max-height:140px;object-fit:contain;border-radius:10px;margin-bottom:10px}
.boss-choice .boss-choice-name{font-size:16px;font-weight:900;margin-bottom:4px}
.boss-choice .boss-choice-stats{font-size:12px;opacity:.7;line-height:1.6}
.diff-btns{display:flex;gap:8px;margin-top:10px;justify-content:center}
.diff-btn{flex:1;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;border:2px solid;transition:all .15s}
.diff-btn.easy{border-color:rgba(100,255,150,.4);background:rgba(100,255,150,.08);color:#64ff96}
.diff-btn.easy:hover{background:rgba(100,255,150,.18)}
.diff-btn.hard{border-color:rgba(255,80,80,.4);background:rgba(255,80,80,.08);color:#ff5050}
.diff-btn.hard:hover{background:rgba(255,80,80,.18)}
.diff-btn:disabled{opacity:.4;cursor:not-allowed}
.cooldown-badge{margin-top:8px;font-size:11px;color:#ffd84d;opacity:.8}

.stock-bar{
  background:rgba(255,255,255,.06);border:1px solid rgba(127,92,255,.3);
  border-radius:12px;padding:14px 16px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.stock-val{font-size:22px;font-weight:900;color:var(--accent)}
.stock-label{font-size:13px;opacity:.7}

/* Animation attaque */
@keyframes attackShake {
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-8px) rotate(-2deg)}
  30%{transform:translateX(8px) rotate(2deg)}
  45%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}
  75%{transform:translateX(-3px)}
}
@keyframes attackFlash {
  0%{opacity:0;transform:scale(.5)}
  20%{opacity:1;transform:scale(1.2)}
  100%{opacity:0;transform:scale(2)}
}
@keyframes dmgPop {
  0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  30%{opacity:1;transform:translate(-50%,-120%) scale(1.2)}
  100%{opacity:0;transform:translate(-50%,-200%) scale(.8)}
}
.boss-img-wrap{position:relative;display:inline-block}
.attack-flash{
  position:absolute;inset:0;border-radius:14px;
  background:radial-gradient(circle,rgba(255,80,80,.9),transparent 70%);
  pointer-events:none;opacity:0;
}
.dmg-popup{
  position:absolute;left:50%;top:50%;
  font-size:28px;font-weight:900;color:#ff4444;
  text-shadow:0 0 20px rgba(255,68,68,.8);
  pointer-events:none;white-space:nowrap;
  animation:dmgPop .9s ease forwards;
}
.timer-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:6px;overflow:hidden;margin:6px 0}
.timer-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#33ff99,#ffd84d,#ff4444);transition:width 1s linear}
.talent-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;padding:14px 18px;
  background:rgba(127,92,255,.1);border:1px solid rgba(127,92,255,.25);
  border-radius:12px;flex-wrap:wrap;gap:10px;
}
.talent-points-badge{
  font-size:20px;font-weight:900;color:var(--gold);
}
.clan-xp-bar-wrap{flex:1;min-width:200px}
.clan-xp-bar-label{font-size:12px;opacity:.7;margin-bottom:4px}
.clan-xp-bar{background:rgba(255,255,255,.1);border-radius:999px;height:8px;overflow:hidden}
.clan-xp-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}

.talents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.talent-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  border-radius:14px;padding:16px;
}
.talent-card.maxed{border-color:rgba(255,216,77,.3);background:rgba(255,216,77,.06)}
.talent-icon{font-size:28px;margin-bottom:8px}
.talent-name{font-size:15px;font-weight:900;margin-bottom:4px}
.talent-desc{font-size:12px;opacity:.65;margin-bottom:12px}
.talent-levels{display:flex;gap:4px;margin-bottom:10px}
.talent-dot{
  width:18px;height:18px;border-radius:999px;
  border:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  transition:background .2s;
}
.talent-dot.filled{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.talent-dot.maxed{background:linear-gradient(135deg,#ffd84d,#ff8800);border-color:transparent}
.talent-current{font-size:12px;color:var(--green);margin-bottom:4px}
.talent-next{font-size:12px;opacity:.6;margin-bottom:10px}
.talent-cost{font-size:12px;color:var(--gold);margin-bottom:8px}

.section-hidden{display:none}

/* PERSONNAGE */
.char-wrap{display:flex;flex-direction:column;gap:16px}

/* === CARTE HERO === */
.char-hero-card{
  border-radius:20px;overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(10,10,20,.6);
  display:flex;flex-direction:column;
}
.char-hero-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center top;
  opacity:.18;filter:blur(2px);transform:scale(1.05);
  transition:opacity .4s;
}
.char-hero-top{
  position:relative;z-index:1;
  display:flex;gap:0;min-height:220px;
}
.char-hero-img-col{
  width:180px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;
  padding:0 0 0 16px;
}
.char-hero-img{
  width:160px;height:210px;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 0 24px var(--cls-color,#7f5cff));
  transition:filter .4s,transform .3s;
}
.char-hero-img:hover{transform:scale(1.04) translateY(-4px)}
.char-hero-img-placeholder{
  width:160px;height:210px;display:flex;align-items:center;justify-content:center;
  font-size:80px;filter:drop-shadow(0 0 24px var(--cls-color,#7f5cff));
}
.char-hero-info-col{
  flex:1;padding:24px 20px 20px;display:flex;flex-direction:column;justify-content:space-between;
}
.char-hero-name{font-size:22px;font-weight:900;margin-bottom:4px}
.char-class-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;margin-bottom:14px;
  border:1px solid;
}
.char-class-pill.no-class{
  background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff;opacity:.7;
}
.char-level-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.char-level-num{font-size:36px;font-weight:900;line-height:1}
.char-level-label{font-size:13px;opacity:.6;font-weight:700}
.char-xp-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:8px;overflow:hidden;margin-bottom:5px}
.char-xp-bar{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.char-xp-label{font-size:11px;opacity:.6}
.char-passive-row{
  margin-top:14px;padding:10px 14px;border-radius:10px;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);
  font-size:12px;line-height:1.7;
}
.char-passive-title{font-size:11px;font-weight:900;opacity:.5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}

/* Points badge flottant */
.char-points-float{
  position:absolute;top:14px;right:14px;z-index:2;
  background:linear-gradient(135deg,#ffd84d,#ff8800);
  border-radius:12px;padding:8px 14px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(255,216,77,.35);
  animation:pointsPulse 2s ease infinite;
}
@keyframes pointsPulse{0%,100%{box-shadow:0 4px 20px rgba(255,216,77,.35)}50%{box-shadow:0 4px 32px rgba(255,216,77,.6)}}
.char-points-float-num{font-size:20px;font-weight:900;color:#000}
.char-points-float-label{font-size:11px;font-weight:800;color:rgba(0,0,0,.7)}

/* Barre XP bottom */
.char-hero-xp-bar-full{
  position:relative;z-index:1;
  height:6px;background:rgba(255,255,255,.08);
}
.char-hero-xp-bar-fill{
  height:100%;transition:width .6s cubic-bezier(.4,0,.2,1);
}

/* === CHOIX DE CLASSE === */
.class-pick-screen{
  border-radius:20px;padding:28px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  text-align:center;
}
.class-pick-title{font-size:20px;font-weight:900;margin-bottom:6px}
.class-pick-sub{font-size:13px;opacity:.6;margin-bottom:24px}
.class-cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.class-cards-row{grid-template-columns:1fr}}
.class-pick-card{
  border-radius:16px;padding:20px 14px;cursor:pointer;
  border:2px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  transition:all .2s;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.class-pick-card:hover{transform:translateY(-4px);border-color:var(--cls-color)!important;background:rgba(255,255,255,.08)}
.class-pick-card.selected{border-color:var(--cls-color)!important;background:rgba(255,255,255,.1)}
.class-pick-img{width:110px;height:145px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 16px var(--cls-color))}
.class-pick-img-ph{font-size:56px;height:110px;display:flex;align-items:flex-end;justify-content:center}
.class-pick-name{font-size:16px;font-weight:900}
.class-pick-desc{font-size:11px;opacity:.6;line-height:1.5}
.class-pick-passives{
  font-size:11px;padding:8px 10px;border-radius:8px;
  background:rgba(0,0,0,.25);width:100%;text-align:left;line-height:1.8;
}
.class-pick-btn{
  margin-top:20px;padding:12px 36px;border-radius:12px;border:none;cursor:pointer;
  font-weight:900;font-size:14px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  transition:opacity .15s,transform .12s;
}
.class-pick-btn:hover{opacity:.85;transform:translateY(-1px)}
.class-pick-btn:disabled{opacity:.35;cursor:not-allowed}

/* === STATS === */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.stats-grid{grid-template-columns:1fr}}
.stat-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:16px;
}
.stat-card.force  {border-color:rgba(255,100,100,.3);background:rgba(255,80,80,.06)}
.stat-card.agilite{border-color:rgba(100,255,150,.3);background:rgba(51,255,153,.06)}
.stat-card.intel  {border-color:rgba(100,180,255,.3);background:rgba(77,166,255,.06)}
.stat-card.dex    {border-color:rgba(255,216,77,.3);background:rgba(255,216,77,.06)}
.stat-icon{font-size:22px;margin-bottom:4px}
.stat-name{font-size:13px;font-weight:900;margin-bottom:2px}
.stat-desc{font-size:11px;opacity:.55;margin-bottom:10px;line-height:1.5}
.stat-value-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:900}
.stat-bonus{font-size:11px;opacity:.65}
.stat-passive-line{font-size:10px;opacity:.5;margin-bottom:6px;font-style:italic}
.stat-dots{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:10px}
.stat-dot{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.12)}
.stat-dot.filled.force  {background:#ff6464}
.stat-dot.filled.agilite{background:#33ff99}
.stat-dot.filled.intel  {background:#4da6ff}
.stat-dot.filled.dex    {background:#ffd84d}
.stat-alloc-btn{
  width:100%;padding:8px;border-radius:10px;border:none;cursor:pointer;
  font-weight:900;font-size:13px;color:#fff;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  transition:all .15s;
}
.stat-alloc-btn:hover:not(:disabled){background:rgba(255,255,255,.2);transform:translateY(-1px)}
.stat-alloc-btn:disabled{opacity:.35;cursor:not-allowed}
.stat-alloc-btn.force  {background:rgba(255,80,80,.25);border-color:rgba(255,80,80,.4)}
.stat-alloc-btn.force:hover:not(:disabled){background:rgba(255,80,80,.4)}
.stat-alloc-btn.agilite{background:rgba(51,255,153,.2);border-color:rgba(51,255,153,.35)}
.stat-alloc-btn.agilite:hover:not(:disabled){background:rgba(51,255,153,.35)}
.stat-alloc-btn.intel  {background:rgba(77,166,255,.2);border-color:rgba(77,166,255,.35)}
.stat-alloc-btn.intel:hover:not(:disabled){background:rgba(77,166,255,.35)}
.stat-alloc-btn.dex    {background:rgba(255,216,77,.2);border-color:rgba(255,216,77,.35)}
.stat-alloc-btn.dex:hover:not(:disabled){background:rgba(255,216,77,.35)}
.char-xp-table{width:100%;border-collapse:collapse;font-size:13px}
.char-xp-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.char-xp-table tr:last-child td{border:none}
.char-xp-table .boss-cell{font-weight:800}
.char-xp-table .xp-cell{color:var(--gold);font-weight:800;text-align:right}

/* DECK */
.raid-card{
  border-radius:12px;border:2px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);cursor:pointer;
  transition:transform .15s,border-color .15s;
  overflow:hidden;position:relative;
}
.raid-card:hover{transform:translateY(-3px);border-color:rgba(127,92,255,.5)}
.raid-card.in-deck{border-color:rgba(127,92,255,.8);box-shadow:0 0 12px rgba(127,92,255,.3)}
.raid-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.raid-card .rc-name{font-size:11px;font-weight:800;padding:5px 6px;text-align:center;line-height:1.3}
.raid-card .rc-rarity{position:absolute;top:5px;right:5px;font-size:11px;padding:2px 6px;border-radius:999px;font-weight:800}
.rc-rarity.common{background:rgba(180,180,180,.3);color:#ccc}
.rc-rarity.rare{background:rgba(77,166,255,.3);color:#4da6ff}
.rc-rarity.epic{background:rgba(192,132,255,.3);color:#c084ff}
.rc-rarity.legendary{background:rgba(255,216,77,.3);color:#ffd84d}
.raid-card .rc-type{position:absolute;top:5px;left:5px;font-size:13px}

.deck-slot{
  width:100px;height:145px;border-radius:12px;

  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .15s;position:relative;overflow:hidden;
  background:rgba(255,255,255,.03);flex-shrink:0;
}
.deck-slot.filled{border-style:solid;border-color:rgba(127,92,255,.6)}
.deck-slot:hover{border-color:rgba(127,92,255,.5)}
.deck-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:10px}
.deck-slot .slot-label{font-size:11px;opacity:.5;z-index:1}
.deck-slot .slot-name{font-size:9px;font-weight:800;position:absolute;bottom:4px;left:0;right:0;text-align:center;z-index:2;background:rgba(0,0,0,.6);padding:2px}
.deck-slot .slot-remove{position:absolute;top:3px;right:3px;z-index:3;background:rgba(255,60,60,.8);border-radius:999px;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}

.bonus-recap{

.card-tooltip{

  border-radius:12px;padding:10px 14px;font-size:12px;max-width:220px;pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}

<body>

<!-- TOPBAR -->
<div class="topbar">
  <a class="cornerLogo" href="/"><img src="poke.png" alt="Logo"/></a>
  <nav class="topNav">
    <a class="topLink" href="/">GACHA</a>
    <a class="topLink" href="/collection.html">COLLECTION</a>
    <a class="topLink" href="/market.html">MARKET</a>
    <a class="topLink" href="/leaderboard.html">LEADERBOARD</a>
    <a class="topLink" href="/friends.html">FRIENDS</a>
    <a class="topLink" style="background:linear-gradient(135deg,rgba(127,92,255,.4),rgba(240,83,197,.4));border-color:rgba(127,92,255,.5)" href="/clan.html">CLAN</a>
  </nav>
  <div style="display:flex;gap:8px;align-items:center">
    <span style="font-size:12px;opacity:.6" id="topUsername"></span>
    <a class="topLink" href="/profile.html">PROFIL</a>
  </div>
</div>

<div class="wrap" id="mainWrap">
  <div class="loading" id="loadingMsg">Chargement...</div>
</div>

<script>
const TOKEN_KEY = "gacha_token_v1";
const token = localStorage.getItem(TOKEN_KEY);
if (!token) location.href = "/login.html";

async function api(path, opts={}) {
  const r = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers||{}), "Authorization": "Bearer "+token, "Content-Type":"application/json" }
  });
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || "Erreur");
  return data;
}

function esc(s){ return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;") }
function fmtNum(n){ return Number(n||0).toLocaleString("fr-FR") }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "à l'instant";
  if(s<3600) return Math.floor(s/60)+"min";
  if(s<86400) return Math.floor(s/3600)+"h";
  return Math.floor(s/86400)+"j";
}

const COLORS = ["#7f5cff","#f053c5","#ff4444","#ff8800","#ffd84d","#33ff99","#33cfff","#a855f7","#ec4899"];

let myData = null;
let clanData = null;
let chatPolling = null;
let myUserId = null;

async function init() {
  try {
    myData = await api("/api/me");
    myUserId = myData.id;
    document.getElementById("topUsername").textContent = myData.name || "";
  } catch(e) { location.href="/login.html"; return; }

  try {
    const data = await api("/api/clan/me");
    clanData = data;
    if (data.clan) {
      renderMyClan(data);
    } else {
      renderNoClan();
    }
  } catch(e) {
    renderNoClan();
  }
}

// ===========================
// NO CLAN VIEW
// ===========================
function renderNoClan() {
  const wrap = document.getElementById("mainWrap");
  wrap.innerHTML = `
    <div class="no-clan-wrap">
      <div style="font-size:48px;margin-bottom:12px">⚔️</div>
      <h2>Tu n'es dans aucun clan</h2>
      <p>Rejoins un clan existant ou crée le tien pour participer aux raids, missions et bien plus !</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="showSection('browse')">Parcourir les clans</button>
        <button class="btn btn-ghost" onclick="showSection('create')">Créer un clan</button>
      </div>
    </div>

    <!-- BROWSE -->
    <div id="section-browse" class="section-hidden">
      <div class="card">
        <div class="card-title">🔍 Clans disponibles</div>
        <div id="clanList" class="clan-list"><div class="loading">Chargement...</div></div>
      </div>
    </div>

    <!-- CREATE -->
    <div id="section-create" class="section-hidden">
      <div class="card">
        <div class="card-title">✨ Créer un clan</div>
        <div id="createAlert"></div>
        <div class="form-grid">
          <div>
            <label>Nom du clan *</label>
            <input id="cName" maxlength="30" placeholder="Mon Super Clan"/>
          </div>
          <div>
            <label>Tag (2-5 lettres) *</label>
            <input id="cTag" maxlength="5" placeholder="MSC" style="text-transform:uppercase"/>
          </div>
        </div>
        <div style="margin-top:12px">
          <label>Description</label>
          <textarea id="cDesc" maxlength="200" placeholder="Présente ton clan..."></textarea>
        </div>
        <div style="margin-top:12px">
          <label>Image du clan (URL)</label>
          <div style="display:flex;gap:10px;align-items:center">
            <input id="cLogo" placeholder="https://..." oninput="previewLogo(this.value)"/>
            <div id="logoPreview" style="width:48px;height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);flex-shrink:0;background-size:cover;background-position:center;"></div>
          </div>
        </div>
        <div style="margin-top:12px">
          <label>Couleur du clan</label>
          <div class="color-options" id="colorPicker"></div>
        </div>
        <div style="margin-top:16px;padding:12px;background:rgba(255,216,77,.08);border:1px solid rgba(255,216,77,.25);border-radius:10px;font-size:13px;">
          💰 Créer un clan coûte <b style="color:var(--gold)">1 000 dollax</b>
        </div>
        <div style="margin-top:16px;display:flex;gap:10px">
          <button class="btn" onclick="createClan()">Créer le clan</button>
          <button class="btn btn-ghost" onclick="showSection(null)">Annuler</button>
        </div>
      </div>
    </div>
  `;
  initColorPicker();
  loadClanList();
}

let selectedColor = COLORS[0];
function initColorPicker() {
  const el = document.getElementById("colorPicker");
  if (!el) return;
  el.innerHTML = COLORS.map(c =>
    `<div class="color-opt ${c===selectedColor?'selected':''}" style="background:${c}" onclick="selectColor('${c}',this)"></div>`
  ).join("");
}
function selectColor(c, el) {
  selectedColor = c;
  document.querySelectorAll(".color-opt").forEach(e => e.classList.remove("selected"));
  el.classList.add("selected");
}

function showSection(name) {
  ["browse","create"].forEach(s => {
    const el = document.getElementById("section-"+s);
    if (el) el.classList.toggle("section-hidden", s !== name);
  });
}

async function loadClanList() {
  const el = document.getElementById("clanList");
  if (!el) return;
  try {
    const data = await api("/api/clan/list");
    if (!data.clans.length) { el.innerHTML = '<div class="loading">Aucun clan pour l\'instant.</div>'; return; }
    el.innerHTML = data.clans.map(c => `
      <div class="clan-list-item">
        <div class="clan-list-tag" style="color:${esc(c.banner_color)}">[${esc(c.tag)}]</div>
        <div class="clan-list-info">
          <div class="clan-list-name">${esc(c.name)}</div>
          <div class="clan-list-sub">Chef: ${esc(c.leader_name)} · ${c.members} membre${c.members>1?'s':''}</div>
          <div class="clan-list-xp">⚡ ${fmtNum(c.xp)} XP</div>
        </div>
        <button class="btn btn-sm" onclick="joinClan(${c.id})">Rejoindre</button>
      </div>
    `).join("");
  } catch(e) { el.innerHTML = '<div class="loading">Erreur de chargement</div>'; }
}

async function joinClan(id) {
  try {
    await api("/api/clan/join", { method:"POST", body: JSON.stringify({ clanId: id }) });
    location.reload();
  } catch(e) { alert(e.message); }
}

async function createClan() {
  const name  = document.getElementById("cName").value.trim();
  const tag   = document.getElementById("cTag").value.trim().toUpperCase();
  const desc  = document.getElementById("cDesc").value.trim();
  const logo  = document.getElementById("cLogo").value.trim();
  const alertEl = document.getElementById("createAlert");

  if (!name || !tag) { alertEl.innerHTML = '<div class="alert alert-error">Nom et tag requis.</div>'; return; }

  try {
    await api("/api/clan/create", { method:"POST", body: JSON.stringify({ name, tag, description: desc, logo, banner_color: selectedColor }) });
    location.reload();
  } catch(e) {
    alertEl.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

function previewLogo(url) {
  const el = document.getElementById("logoPreview");
  if (!el) return;
  el.style.backgroundImage = url ? `url('${url}')` : '';
}

// ===========================
// MY CLAN VIEW
// ===========================
function renderMyClan(data) {
  const { clan, myRole, members, boss, availableBosses } = data;
  const isLeader = myRole === 'leader';
  const isOfficer = myRole === 'officer' || isLeader;

  // Stocker les données du boss pour usage immédiat
  window._initialBossData = { boss, availableBosses };

  const wrap = document.getElementById("mainWrap");
  wrap.innerHTML = `
    <!-- BANNER -->
    <div class="clan-banner" style="--bannerColor:${esc(clan.banner_color)}">
      ${clan.logo
        ? `<div class="clan-logo" style="background-image:url('${esc(clan.logo)}')"></div>`
        : `<div class="clan-tag" style="color:${esc(clan.banner_color)}">[${esc(clan.tag)}]</div>`
      }
      <div class="clan-info">
        <div class="clan-name">${esc(clan.name)} <span style="font-size:14px;opacity:.6;font-weight:600">[${esc(clan.tag)}]</span></div>

function renderMemberCard(m, isOfficer, isLeader, leaderName) {
  const isMe = m.name === (myData?.name);
  const avatarStyle = m.avatar ? `background-image:url('${esc(m.avatar)}')` : '';
  const initials = (m.name||"?").slice(0,2).toUpperCase();

  let actions = '';
  if (isLeader && m.name !== leaderName) {
    actions = `
      <div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">
        ${m.role==='member'?`<button class="btn btn-sm" style="font-size:10px;padding:4px 8px" onclick="promoteUser('${esc(m.name)}','officer')">→ Officier</button>`:''}
        ${m.role==='officer'?`<button class="btn btn-ghost btn-sm" style="font-size:10px;padding:4px 8px" onclick="promoteUser('${esc(m.name)}','member')">→ Membre</button>`:''}
        <button class="btn btn-danger btn-sm" style="font-size:10px;padding:4px 8px" onclick="kickUser('${esc(m.name)}')">Exclure</button>
      </div>
    `;
  }

  return `
    <div class="member-card" ${isMe?'style="border-color:rgba(127,92,255,.4);background:rgba(127,92,255,.08)"':''}>
      <div class="member-avatar" style="${avatarStyle}">${avatarStyle?'':initials}</div>
      <div style="min-width:0;flex:1">
        <div class="member-name">${esc(m.name)} ${isMe?'<span style="font-size:10px;color:var(--accent)">(toi)</span>':''}</div>
        <div class="member-role ${m.role==='leader'?'role-leader':m.role==='officer'?'role-officer':''}">${m.role==='leader'?'👑 Meneur':m.role==='officer'?'⭐ Officier':'Membre'}</div>
        <div class="member-dmg">⚔️ ${fmtNum(m.damage_total)} dmg total</div>
        ${actions}
      </div>
    </div>
  `;
}

let currentTab = 'boss';
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  ['boss','missions','members','chat','talents','deck','character','leaderboard','manage'].forEach(t => {
    const tabEl = document.getElementById('tab-'+t);
    if (tabEl) tabEl.classList.toggle('section-hidden', t !== name);
  });

  currentTab = name;

  if (name === 'chat') { loadChat(); startChatPolling(); } else { stopChatPolling(); }
  if (name === 'leaderboard') loadLeaderboard();
  if (name === 'boss') { _bossFirstLoad = true; loadBossData(); startBossPolling(); loadDeckBonusRecap(); } else { stopBossPolling(); }
  if (name === 'talents') loadTalents();
  if (name === 'deck') loadDeck();
  if (name === 'character') loadCharacter();
}

let _charData = null;

// ⚠️ URLs GitHub de tes images de classe
const CLASS_IMAGES = {
  slayer:   'https://raw.githubusercontent.com/skunfy/pok-gacha/main/slayer.png',
  assassin: 'https://raw.githubusercontent.com/skunfy/pok-gacha/main/assassin.png',
  soutien:  'https://raw.githubusercontent.com/skunfy/pok-gacha/main/soutient.png',
};

const CLASS_DEF = {
  slayer:   { label:'Slayer',   icon:'⚔️', color:'#ff6464', desc:'Maître du combat direct.', passives:'+10% DMG permanent' },
  assassin: { label:'Assassin', icon:'🗡️', color:'#c084ff', desc:'Frappe vite et fort.',      passives:'+8% Crit · +15% 1ère frappe' },
  soutien:  { label:'Soutien',  icon:'🛡️', color:'#4da6ff', desc:'Explosif en fin de combat.',passives:'+12% DMG quand boss <50% HP' },
};

let _deckBonusData = null;

async function loadCharacter() {
  const el = document.getElementById('characterContent');
  if (!el) return;
  try {
    const [c] = await Promise.all([
      api('/api/character'),
      loadEquipment(),
      api('/api/raid/bonus').then(d => { _deckBonusData = d; }).catch(() => {}),
    ]);
    _charData = c;
    if (!c.char_class) {
      renderClassPicker(c);
    } else {
      renderCharacter(c);
    }
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">Erreur chargement personnage</div>`;
  }
}

function selectClassCard(key) {
  _selectedClass = key;
  document.querySelectorAll('.class-pick-card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById('classpick-' + key);
  if (card) card.classList.add('selected');
  const btn = document.getElementById('confirmClassBtn');
  if (btn) btn.disabled = false;
}

async function confirmClass(isChange) {
  if (!_selectedClass) return;
  const alertEl = document.getElementById('classPickAlert');
  try {
    const data = await api('/api/character/class', {
      method: 'POST',
      body: JSON.stringify({ char_class: _selectedClass })
    });
    if (data.ok) {
      const fresh = await api('/api/character');
      _charData = fresh;
      renderCharacter(fresh);
    }
  } catch(e) {
    if (alertEl) alertEl.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

let _equipData = null;

const SLOT_DEF = {
  weapon: { label:'Arme',    icon:'⚔️' },
  armor:  { label:'Armure',  icon:'🛡️' },
  boots:  { label:'Bottes',  icon:'👢' },
  head:   { label:'Casque',  icon:'🪖' },
  ring:   { label:'Anneau',  icon:'💍' },
};

const EQ_RARITY_COLOR = {
  common:'#aaa', rare:'#4da6ff', epic:'#c084ff', legendary:'#ffd84d'
};
const EQ_RARITY_LABEL = {
  common:'Commun', rare:'Rare', epic:'Épique', legendary:'Légendaire'
};

async function loadEquipment() {
  try {
    _equipData = await api('/api/equipment');
  } catch(e) {
    _equipData = { inventory:[], equipped:{} };
  }
}

function openEquipInventory(slot) {
  const inventory = (_equipData?.inventory || []).filter(i => i.slot === slot);
  if (!inventory.length) {
    showAlert(`Aucun équipement de type "${SLOT_DEF[slot]?.label}" dans ton inventaire.`, 'info');
    return;
  }
  // Équiper le premier non-équipé de ce slot, ou ouvrir une confirmation
  const unequipped = inventory.find(i => !i.equipped_slot);
  if (unequipped) equipItem(unequipped.id, slot);
  else showAlert('Tous tes items de ce type sont déjà équipés.', 'info');
}

async function equipItem(id, slot) {
  try {
    await api('/api/equipment/equip', { method:'POST', body: JSON.stringify({ id }) });
    await loadEquipment();
    const fresh = await api('/api/character');
    _charData = fresh;
    renderCharacter(fresh);
  } catch(e) { showAlert(e.message, 'error'); }
}

async function unequipItem(id) {
  try {
    await api('/api/equipment/equip', { method:'POST', body: JSON.stringify({ id, unequip: true }) });
    await loadEquipment();
    const fresh = await api('/api/character');
    _charData = fresh;
    renderCharacter(fresh);
  } catch(e) { showAlert(e.message, 'error'); }
}

async function allocateStat(statKey) {
  try {
    const data = await api('/api/character/allocate', {
      method: 'POST',
      body: JSON.stringify({ stat: statKey })
    });
    if (data.ok) {
      _charData.stat_force        = statKey === 'stat_force'        ? data.new_value : _charData.stat_force;
      _charData.stat_agilite      = statKey === 'stat_agilite'      ? data.new_value : _charData.stat_agilite;
      _charData.stat_intelligence = statKey === 'stat_intelligence'  ? data.new_value : _charData.stat_intelligence;
      _charData.stat_dexterite    = statKey === 'stat_dexterite'    ? data.new_value : _charData.stat_dexterite;
      _charData.points_available  = data.points_available;
      renderCharacter(_charData);
    }
  } catch(e) {
    showAlert(e.message || 'Erreur', 'error');
  }
}

async function resetStats() {
  if (!confirm('Réinitialiser toutes tes stats pour 500 dollax ?')) return;
  const alertEl = document.getElementById('charAlert');
  try {
    const data = await api('/api/character/reset', { method: 'POST' });
    if (data.ok) {
      _charData.stat_force = 0;
      _charData.stat_agilite = 0;
      _charData.stat_intelligence = 0;
      _charData.stat_dexterite = 0;
      _charData.points_available = data.points_available;
      renderCharacter(_charData);
      if (alertEl) alertEl.innerHTML = `<div class="alert alert-success">✅ Stats reset ! ${data.points_available} points récupérés.</div>`;
      setTimeout(() => { if(alertEl) alertEl.innerHTML = ''; }, 3000);
    }
  } catch(e) {
    if (alertEl) alertEl.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

let _raidTimer = null;
let _raidExpiresAt = null;
let _raidBossId = null;
let _bossFirstLoad = true;

async function loadBossData() {
  try {
    let data;

    // Premier chargement : utiliser les données déjà dans la réponse /api/clan/me
    if (_bossFirstLoad && window._initialBossData) {
      _bossFirstLoad = false;
      data = window._initialBossData;
      // Compléter avec myStock/leaderboard si manquants → appel API léger
      if (data.boss && (data.boss.myStock === undefined || !data.boss.leaderboard)) {
        const fresh = await api("/api/clan/boss");
        data = fresh;
      }
    } else {
      data = await api("/api/clan/boss");
    }

    // Pas de raid actif → afficher sélection
    if (!data.boss) {
      const choicesEl = document.getElementById("bossChoices");
      if (!choicesEl) return;

      const canStart = ['leader','officer'].includes(window._clanData?.myRole);
      const bosses = data.availableBosses || [];
      const cooldowns = data.cooldowns || {};

      // Grouper par boss (arakas, myntalis, xenos)
      const groups = {};
      for (const b of bosses) {
        if (!groups[b.bossKey]) groups[b.bossKey] = { easy: null, hard: null };
        groups[b.bossKey][b.difficulty] = b;
      }

      const cooldownLabel = { arakas: '1 jour', myntalis: '3 jours', xenos: '7 jours' };
      const bossOrder = ['arakas', 'myntalis', 'xenos'];

      choicesEl.innerHTML = bossOrder.map(bk => {
        const easy = groups[bk]?.easy;
        const hard = groups[bk]?.hard;
        if (!easy) return '';
        const cd = cooldowns[bk] || { available: true, daysLeft: 0 };
        const locked = !cd.available;

        return `
          <div class="boss-choice ${locked ? 'locked' : 'available'}">
            <img src="${esc(easy.image)}" alt="${esc(easy.name)}" style="mix-blend-mode:screen" onerror="this.style.display='none'">
            <div class="boss-choice-name">👹 ${esc(easy.name)}</div>
            <div class="boss-choice-stats">
              ❤️ ${fmtNum(easy.hp_max)} PV<br>
              🕒 Cooldown : ${cooldownLabel[bk]||'?'}
            </div>
            ${locked
              ? `<div class="cooldown-badge">⏳ Disponible dans ${cd.daysLeft} jour${cd.daysLeft>1?'s':''}</div>`
              : canStart ? `
                <div style="margin-top:8px;font-size:11px;opacity:.6;margin-bottom:6px">Choisir la difficulté :</div>
                <div class="diff-btns">
                  <button class="diff-btn easy" onclick="startRaid('${easy.key}')">
                    🟢 Facile<br>
                    <span style="font-size:10px;opacity:.8">${fmtNum(easy.reward)}💰 · ${easy.duration>=4*3600000?'4h':'1h'}</span>
                  </button>
                  ${hard ? `<button class="diff-btn hard" onclick="startRaid('${hard.key}')">
                    🔴 Hardcore<br>
                    <span style="font-size:10px;opacity:.8">${fmtNum(hard.reward)}💰 · ${hard.duration>=4*3600000?'4h':'1h'}</span>
                  </button>` : ''}
                </div>`
              : `<div style="font-size:11px;opacity:.5;margin-top:8px">Meneur/Officier seulement</div>`
            }
          </div>
        `;
      }).join('');
      loadLastRaid();
      return;
    }

    // Raid actif → mettre à jour l'UI
    const boss = data.boss;
    _raidBossId = boss.id;
    _raidExpiresAt = boss.expires_at ? Number(boss.expires_at) : null;

    // Stock
    const myStock = boss.myStock ?? data.myStock ?? 0;
    const stockEl = document.getElementById("stockVal");
    if (stockEl) stockEl.textContent = fmtNum(myStock);

    const attackBtn = document.getElementById("attackBtn");
    if (attackBtn) {
      attackBtn.disabled = myStock <= 0;
      attackBtn.textContent = myStock > 0 ? `⚔️ ATTAQUER ! (${fmtNum(myStock)} dmg)` : '⚔️ Ouvre des cartes...';
    }

    // HP bar
    const pct = Math.max(0, Math.round((boss.hp_current / boss.hp_max) * 100));
    const hpBar = document.getElementById("bossHpBar");
    if (hpBar) hpBar.style.width = pct + '%';

    // Leaderboard
    const leaderboard = boss.leaderboard ?? data.leaderboard ?? [];
    const lbEl = document.getElementById("bossLeaderboard");
    if (lbEl && leaderboard.length >= 0) {
      lbEl.innerHTML = leaderboard.map((r,i) =>
        `<div class="dmg-row ${r.name===myData?.name?'dmg-me':''}">
          <span>#${i+1} ${esc(r.name)}</span>
          <span>⚔️ ${fmtNum(r.total)}</span>
        </div>`
      ).join('') || '<div style="opacity:.5;font-size:13px">Aucun dégât encore</div>';
    }

    // Timer
    startRaidTimer();
  } catch(e) {}
}

function startRaidTimer() {
  if (_raidTimer) clearInterval(_raidTimer);
  if (!_raidExpiresAt) return;

  function updateTimer() {
    const left = Math.max(0, _raidExpiresAt - Date.now());
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    const s = Math.floor((left % 60000) / 1000);
    const txt = left > 0
      ? `⏱️ ${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s restantes`
      : '⏰ Temps écoulé !';

    const timerEl = document.getElementById("timerDisplay");
    if (timerEl) timerEl.textContent = txt;

    // Barre timer
    const bossQ = window._lastBossData;
    if (bossQ?.started_at && _raidExpiresAt) {
      const total = _raidExpiresAt - bossQ.started_at;
      const elapsed = Date.now() - bossQ.started_at;
      const pct = Math.max(0, 100 - Math.round((elapsed / total) * 100));
      const bar = document.getElementById("timerBar");
      if (bar) bar.style.width = pct + '%';
    }

    if (left <= 0) {
      clearInterval(_raidTimer);
      loadBossData(); // Recharger pour afficher état expiré
    }
  }
  updateTimer();
  _raidTimer = setInterval(updateTimer, 1000);
}

}

async function attackBoss() {
  const btn = document.getElementById("attackBtn");
  if (btn) btn.disabled = true;

  try {
    const data = await api("/api/clan/raid/attack", { method:"POST" });

    // Animation d'attaque
    playAttackAnimation(data.damage, data.isCrit);

    // ✅ Mise à jour immédiate des HP dans l'UI
    if (data.boss) {
      const pct = Math.max(0, Math.round((data.newHp / data.boss.hp_max) * 100));
      const hpBar = document.getElementById("bossHpBar");
      const hpText = document.querySelector(".hp-text");
      if (hpBar) {
        hpBar.style.width = pct + '%';
        const barColor = pct > 50 ? '#ff4444' : pct > 20 ? '#ff8800' : '#33ff99';
        hpBar.style.background = barColor;
      }
      if (hpText) hpText.innerHTML = `${fmtNum(data.newHp)} / ${fmtNum(data.boss.hp_max)} PV · <span style="color:var(--gold)">🏆 ${fmtNum(data.boss.reward)} dollax</span>`;
      const pctText = document.querySelector('.boss-card [style*="opacity:.6"]');
      if (pctText) pctText.textContent = pct + '% restants';
    }

    // ✅ Mise à jour immédiate du leaderboard
    if (data.leaderboard) {
      const lbEl = document.getElementById("bossLeaderboard");
      if (lbEl) {
        lbEl.innerHTML = data.leaderboard.map((r,i) =>
          `<div class="dmg-row ${r.name===myData?.name?'dmg-me':''}">
            <span>#${i+1} ${esc(r.name)}</span>
            <span>⚔️ ${fmtNum(r.total)}</span>
          </div>`
        ).join('') || '<div style="opacity:.5;font-size:13px">Aucun dégât encore</div>';
      }
    }

    if (data.defeated) {
      setTimeout(() => {
        showAlert('🏆 Boss vaincu ! Récompenses distribuées !', 'success');
        setTimeout(() => location.reload(), 2000);
      }, 800);
    } else {
      if (btn) { btn.disabled = false; btn.textContent = '⚔️ Ouvre des cartes...'; }
    }
  } catch(e) {
    alert(e.message);
    if (btn) btn.disabled = false;
  }
}

function playAttackAnimation(dmg, isCrit = false) {
  // Shake le boss
  const img = document.getElementById("bossImg");
  const wrap = document.getElementById("bossImgWrap");
  const flash = document.getElementById("attackFlash");

  if (wrap) {
    wrap.style.animation = 'none';
    void wrap.offsetWidth;
    wrap.style.animation = 'attackShake .5s ease';
    setTimeout(() => { wrap.style.animation = ''; }, 500);
  }

  if (flash) {
    flash.style.animation = 'none';
    void flash.offsetWidth;
    flash.style.opacity = '1';
    flash.style.animation = 'attackFlash .6s ease forwards';
    setTimeout(() => { flash.style.opacity = '0'; }, 600);
  }

  // Popup dégâts
  if (wrap) {
    const popup = document.createElement('div');
    popup.className = 'dmg-popup';
    popup.innerHTML = `-${fmtNum(dmg)}${isCrit ? ' <span style="font-size:18px;color:#ffd84d">CRIT!</span>' : ''}`;
    wrap.appendChild(popup);
    setTimeout(() => popup.remove(), 900);
  }

  // Vider le stock dans l'UI
  const stockEl = document.getElementById("stockVal");
  if (stockEl) stockEl.textContent = '0';
  const attackBtn = document.getElementById("attackBtn");
  if (attackBtn) attackBtn.textContent = '⚔️ Ouvre des cartes...';
}

function showAlert(msg, type='success') {
  const div = document.createElement('div');
  div.className = `alert alert-${type}`;
  div.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9999;min-width:300px;text-align:center';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}
