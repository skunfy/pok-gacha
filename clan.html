let _deckData = null;
let _currentFilter = 'all';
let _selectedSlot = null;
const RARITY_LABEL = { common:'⚪', rare:'🔵', epic:'🟣', legendary:'🟡' };
const RARITY_COLOR = { common:'common', rare:'rare', epic:'epic', legendary:'legendary' };
const TYPE_ICON = { slayer:'⚔️', soutien:'🛡️', assassin:'🗡️' };

async function loadDeck() {
  try {
    _deckData = await api("/api/raid/cards");
    renderDeckSlots();
    renderInventory();
    await loadDeckBonusRecap();
  } catch(e) { console.error("loadDeck error:", e); }
}

async function loadDeckBonusRecap() {
  try {
    const bonusData = await api("/api/raid/bonus");
    const el1 = document.getElementById("deckBonusRecap");
    const el2 = document.getElementById("deckBonusRaidRecap");
    const html = renderBonusRecap(bonusData);
    if (el1) el1.innerHTML = html;
    if (el2) el2.innerHTML = html;
  } catch(e) {}
}

function renderBonusRecap(data) {
  if (!data || data.noClan) return '';
  const b = data.bonus;
  if (!b) return '';

  const tags = [];
  if (b.dmg_bonus > 0) tags.push(`<span class="bonus-tag" style="color:#ff8844">⚔️ +${b.dmg_bonus}% DMG</span>`);
  if (b.crit > 0) tags.push(`<span class="bonus-tag" style="color:#ffd84d">💥 +${b.crit}% CRIT</span>`);
  if (b.first_attack > 0) tags.push(`<span class="bonus-tag" style="color:#44aaff">⚡ +${b.first_attack}% 1ère frappe</span>`);

  // Bonus conditionnels inactifs (condition HP non remplie)
  const conditionalTags = [];
  if (b.cards && _deckData?.catalogue) {
    for (const card of b.cards) {
      const full = _deckData.catalogue.find(c => c.key === card.key);
      if (!full || full.hp_threshold === null) continue;

      // Vérifier si la condition n'est PAS remplie actuellement
      const conditionActive = full.hp_above
        ? data.hpPct > full.hp_threshold
        : data.hpPct < full.hp_threshold;

      if (!conditionActive) {
        const condText = full.hp_above ? `boss > ${full.hp_threshold}% HP` : `boss < ${full.hp_threshold}% HP`;
        if (full.dmg_bonus) conditionalTags.push(`<span class="bonus-tag" style="color:#888;text-decoration:line-through" title="Actif quand ${condText}">⚔️ +${full.dmg_bonus}% DMG</span>`);
        if (full.crit) conditionalTags.push(`<span class="bonus-tag" style="color:#888;text-decoration:line-through" title="Actif quand ${condText}">💥 +${full.crit}% CRIT</span>`);
        if (full.first_attack) conditionalTags.push(`<span class="bonus-tag" style="color:#888;text-decoration:line-through" title="Actif quand ${condText}">⚡ +${full.first_attack}% 1ère frappe</span>`);
        conditionalTags.push(`<span style="font-size:10px;opacity:.5;align-self:center">(${condText})</span>`);
      }
    }
  }

  if (!tags.length && !conditionalTags.length) {
    return `<div class="bonus-recap"><div style="opacity:.6;font-size:13px">🃏 Aucun bonus actif — équipe des cartes dans ton deck !</div></div>`;
  }

  return `
    <div class="bonus-recap">
      <div style="font-size:12px;opacity:.7;margin-bottom:6px">🃏 Bonus deck actifs (${data.hpPct}% HP boss)</div>
      <div class="bonus-row">${tags.join('') || '<span style="opacity:.5;font-size:12px">Aucun bonus actif pour le HP actuel</span>'}</div>
      ${conditionalTags.length ? `
        <div style="font-size:11px;opacity:.6;margin-top:8px;margin-bottom:4px">⏳ Bonus conditionnels (inactifs) :</div>
        <div class="bonus-row">${conditionalTags.join('')}</div>
      ` : ''}
      ${b.cards?.length ? `<div style="font-size:11px;opacity:.5;margin-top:6px">${b.cards.map(c=>c.name).join(' · ')}</div>` : ''}
    </div>
  `;
}

function renderDeckSlots() {
  const el = document.getElementById("deckSlots");
  if (!el || !_deckData) return;
  const deck = _deckData.deck || Array(5).fill(null);

  el.innerHTML = deck.map((card, i) => {
    const slot = i + 1;
    if (card) {
      return `
        <div class="deck-slot filled" onclick="selectSlot(${slot})" title="Cliquer pour changer">
          <img src="${esc(card.image)}" alt="${esc(card.name)}" onerror="this.style.display='none'">
          <div class="slot-name">${esc(card.name)}</div>
          <div class="slot-remove" onclick="event.stopPropagation();removeFromSlot(${slot})">✕</div>
        </div>`;
    } else {
      return `
        <div class="deck-slot ${_selectedSlot===slot?'filled':''}" onclick="selectSlot(${slot})" style="${_selectedSlot===slot?'border-color:rgba(255,216,77,.8);':''}">
          <div class="slot-label">${_selectedSlot===slot?'← Choisis':'Slot '+slot}</div>
        </div>`;
    }
  }).join('');
}

function selectSlot(slot) {
  _selectedSlot = (_selectedSlot === slot) ? null : slot;
  renderDeckSlots();
  if (_selectedSlot) showAlert(`Slot ${_selectedSlot} sélectionné — clique une carte pour l'équiper`, 'success');
}

async function removeFromSlot(slot) {
  try {
    await api("/api/raid/deck", { method:"POST", body: JSON.stringify({ slot, card_key: "" }) });
    _deckData = await api("/api/raid/cards");
    renderDeckSlots();
    renderInventory();
    await loadDeckBonusRecap();
  } catch(e) { alert(e.message); }
}

async function equipCard(cardKey) {
  if (!_selectedSlot) {
    showAlert("Sélectionne d'abord un slot dans ton deck !", 'error');
    return;
  }
  try {
    await api("/api/raid/deck", { method:"POST", body: JSON.stringify({ slot: _selectedSlot, card_key: cardKey }) });
    _selectedSlot = null;
    _deckData = await api("/api/raid/cards");
    renderDeckSlots();
    renderInventory();
    await loadDeckBonusRecap();
  } catch(e) { alert(e.message); }
}

function filterCards(type) {
  _currentFilter = type;
  ['all','slayer','soutien','assassin'].forEach(t => {
    const btn = document.getElementById('filter'+t.charAt(0).toUpperCase()+t.slice(1));
    if (btn) btn.style.opacity = (t === type) ? '1' : '0.5';
  });
  renderInventory();
}

function renderInventory() {
  const el = document.getElementById("cardInventory");
  if (!el || !_deckData) return;

  const deckKeys = (_deckData.deck || []).filter(Boolean).map(c => c.key);
  let cards = _deckData.cards || [];
  if (_currentFilter !== 'all') cards = cards.filter(c => c.type === _currentFilter);

  if (!cards.length) {
    el.innerHTML = `<div style="opacity:.5;font-size:13px;grid-column:1/-1">Aucune carte${_currentFilter!=='all'?' dans cette catégorie':''} — vaincs des boss pour en obtenir !</div>`;
    return;
  }

  el.innerHTML = cards.map(card => {
    const inDeck = deckKeys.includes(card.key);
    return `
      <div class="raid-card ${inDeck?'in-deck':''}"
           onclick="openCardZoom('${card.key}')"
           ondblclick="equipCard('${card.key}')">
        <div class="rc-type">${TYPE_ICON[card.type]||''}</div>
        <span class="rc-rarity ${RARITY_COLOR[card.rarity]||''}">${RARITY_LABEL[card.rarity]||''}</span>
        <img src="${esc(card.image)}" alt="${esc(card.name)}" onerror="this.src=''; this.style.height='80px';">
        <div class="rc-name">${esc(card.name)}</div>
        ${inDeck ? '<div style="position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:9px;color:#7f5cff;font-weight:900;background:rgba(0,0,0,.5);padding:2px">ÉQUIPÉE</div>' : ''}
      </div>`;
  }).join('');
}

function openCardZoom(cardKey) {
  const card = (_deckData?.catalogue || []).find(c => c.key === cardKey);
  if (!card) return;

  const deckKeys = (_deckData?.deck || []).filter(Boolean).map(c => c.key);
  const inDeck = deckKeys.includes(cardKey);

  const lines = [];
  if (card.dmg_bonus) lines.push({ icon:'⚔️', text:`+${card.dmg_bonus}% DMG`, color:'#ff8844' });
  if (card.crit) lines.push({ icon:'💥', text:`+${card.crit}% Crit`, color:'#ffd84d' });
  if (card.first_attack) lines.push({ icon:'⚡', text:`+${card.first_attack}% 1ère frappe`, color:'#44aaff' });
  if (card.hp_threshold !== null) lines.push({ icon:'📊', text:`Boss ${card.hp_above?'>':'<'}${card.hp_threshold}% HP`, color:'#aaa' });
  if (card.team_synergy) lines.push({ icon:'🔗', text:'Synergie clan', color:'#c084ff' });

  const rarityColors = { common:'#ccc', rare:'#4da6ff', epic:'#c084ff', legendary:'#ffd84d' };
  const rarityNames = { common:'Commune', rare:'Rare', epic:'Épique', legendary:'Légendaire' };

  const modal = document.createElement('div');
  modal.className = 'raid-card-modal';
  modal.innerHTML = `
    <div class="raid-card-modal-inner" style="position:relative">
      <span class="raid-card-modal-close" onclick="this.closest('.raid-card-modal').remove()">✕</span>
      <div class="raid-card-modal-img">
        <img src="${esc(card.image)}" alt="${esc(card.name)}" onerror="this.style.display='none'">
      </div>
      <div class="raid-card-modal-info">
        <div class="raid-card-modal-name">${esc(card.name)}</div>
        <div class="raid-card-modal-type">
          <span style="color:${rarityColors[card.rarity]}">${RARITY_LABEL[card.rarity]} ${rarityNames[card.rarity]}</span>
          &nbsp;·&nbsp; ${TYPE_ICON[card.type]} ${card.type}
        </div>
        ${lines.map(l => `<div class="raid-card-modal-stat"><span>${l.icon}</span><span style="color:${l.color}">${esc(l.text)}</span></div>`).join('')}
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
          ${_selectedSlot
            ? `<button class="btn btn-sm" style="background:rgba(127,92,255,.3);border-color:rgba(127,92,255,.5)" onclick="equipCard('${cardKey}');this.closest('.raid-card-modal').remove()">
                Équiper slot ${_selectedSlot}
               </button>`
            : `<button class="btn btn-sm btn-ghost" onclick="this.closest('.raid-card-modal').remove();_selectedSlot=null;renderDeckSlots();showAlert('Sélectionne un slot puis clique Équiper','success')">
                Équiper...
               </button>`
          }
          ${inDeck ? `<button class="btn btn-sm btn-danger" onclick="removeCardFromDeck('${cardKey}');this.closest('.raid-card-modal').remove()">Retirer</button>` : ''}
          <button class="btn btn-sm btn-ghost" onclick="this.closest('.raid-card-modal').remove()">Fermer</button>
        </div>
      </div>
    </div>
  `;
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

async function removeCardFromDeck(cardKey) {
  // Trouver le slot de la carte
  const deck = _deckData?.deck || [];
  const slot = deck.findIndex(c => c?.key === cardKey) + 1;
  if (slot > 0) await removeFromSlot(slot);
}

let _tooltip = null;
function showCardTooltip(e, cardKey) {
  const card = (_deckData?.catalogue || []).find(c => c.key === cardKey);
  if (!card) return;
  hideCardTooltip();

  const lines = [];
  if (card.dmg_bonus) lines.push(`⚔️ +${card.dmg_bonus}% DMG`);
  if (card.crit) lines.push(`💥 +${card.crit}% Crit`);
  if (card.first_attack) lines.push(`⚡ +${card.first_attack}% 1ère frappe`);
  if (card.hp_threshold) lines.push(`📊 Condition: boss ${card.hp_above?'>':'<'}${card.hp_threshold}% HP`);
  if (card.team_synergy) lines.push(`🔗 Synergie clan active`);

  _tooltip = document.createElement('div');
  _tooltip.className = 'card-tooltip';
  _tooltip.innerHTML = `
    <div style="font-weight:900;margin-bottom:6px">${esc(card.name)}</div>
    <div style="color:var(--accent2);font-size:11px;margin-bottom:6px">${TYPE_ICON[card.type]} ${card.type} · ${RARITY_LABEL[card.rarity]} ${card.rarity}</div>
    ${lines.map(l=>`<div style="margin-bottom:2px">${l}</div>`).join('')}
  `;
  document.body.appendChild(_tooltip);
  _tooltip.style.left = Math.min(e.clientX + 12, window.innerWidth - 240) + 'px';
  _tooltip.style.top = Math.min(e.clientY + 12, window.innerHeight - 150) + 'px';
}

function hideCardTooltip() {
  if (_tooltip) { _tooltip.remove(); _tooltip = null; }
}

// ===========================
// MANAGE ACTIONS
// ===========================
async function distributeBank() {
  const target = document.getElementById("bankTarget")?.value;
  const amount = Number(document.getElementById("bankAmount")?.value)||0;
  const alertEl = document.getElementById("bankAlert");
  if (!target || amount < 1) { alertEl.innerHTML='<div class="alert alert-error">Sélectionne un membre et un montant.</div>'; return; }

  const members = window._clanMembers || [];
  const member = members.find(m => m.name === target);
  if (!member) { alertEl.innerHTML='<div class="alert alert-error">Membre introuvable.</div>'; return; }

  try {
    await api("/api/clan/bank/distribute", { method:"POST", body: JSON.stringify({ userId: member.user_id || member.id, amount }) });
    alertEl.innerHTML=`<div class="alert alert-success">✅ ${fmtNum(amount)} dollax envoyés à ${esc(target)} !</div>`;
    setTimeout(()=>location.reload(), 1500);
  } catch(e) { alertEl.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`; }
}

async function leaveClan() {
  if (!confirm("Quitter le clan ?")) return;
  try {
    await api("/api/clan/leave", { method:"POST" });
    location.reload();
  } catch(e) { alert(e.message); }
}

async function kickUser(name) {
  if (!confirm(`Exclure ${name} ?`)) return;
  const m = (window._clanMembers||[]).find(m=>m.name===name);
  if (!m) return;
  try {
    await api("/api/clan/kick", { method:"POST", body: JSON.stringify({ userId: m.user_id||m.id }) });
    location.reload();
  } catch(e) { alert(e.message); }
}

async function promoteUser(name, role) {
  const m = (window._clanMembers||[]).find(m=>m.name===name);
  if (!m) return;
  try {
    await api("/api/clan/promote", { method:"POST", body: JSON.stringify({ userId: m.user_id||m.id, role }) });
    location.reload();
  } catch(e) { alert(e.message); }
}

function disbandConfirm() {
  document.getElementById('dissolveConfirmBox').style.display = 'block';
  document.getElementById('dissolveInput').focus();
}

async function dissolveClan() {
  const input = document.getElementById("dissolveInput")?.value.trim();
  const alertEl = document.getElementById("dissolveAlert");

  if (input !== "DISSOUDRE") {
    alertEl.innerHTML = '<div class="alert alert-error">Tape exactement DISSOUDRE pour confirmer.</div>';
    return;
  }

  try {
    await api("/api/clan/dissolve", { method: "POST", body: JSON.stringify({ confirm: "DISSOUDRE" }) });
    alertEl.innerHTML = '<div class="alert alert-success">Clan dissous. Redirection...</div>';
    setTimeout(() => location.reload(), 1500);
  } catch(e) {
    alertEl.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

// ===========================
// INIT
// ===========================
init().finally(() => {
  document.getElementById("loadingMsg")?.remove();
});

// Load boss data on start if clan exists
setTimeout(() => {
  if (document.getElementById("bossLeaderboard") || document.getElementById("bossChoices") || document.getElementById("raidAlert")) {
    loadBossData();
    startBossPolling();
  }
}, 500);
</script>
