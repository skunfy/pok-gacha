<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clan — Gachax</title>
<style>
:root{
  --bg1:#05060d;--bg2:#090b18;
  --accent:#7f5cff;--accent2:#f053c5;
  --gold:#ffd84d;--red:#ff4444;--green:#33ff99;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto;color:#fff;overflow-x:hidden}
body{
  background:
    radial-gradient(900px 520px at 20% 10%,rgba(80,130,255,.22),transparent 60%),
    radial-gradient(900px 600px at 85% 30%,rgba(255,80,220,.18),transparent 62%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;
  background:rgba(5,6,13,.85);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
}
.topbar a{color:#fff;text-decoration:none;font-weight:800;font-size:13px;opacity:.8}
.topbar a:hover{opacity:1}
.topNav{display:flex;gap:14px;align-items:center}
.topLink{
  padding:8px 10px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  color:#fff;font-size:12px;font-weight:900;text-decoration:none;
  transition:background .12s;white-space:nowrap;
}
.topLink:hover{background:rgba(255,255,255,.14)}
.cornerLogo{width:70px;flex:0 0 auto}
.cornerLogo img{width:100%;height:auto;display:block}

/* LAYOUT */
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px}

/* CARDS */
.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);
  border-radius:18px;padding:20px;
}
.card-title{font-size:15px;font-weight:900;letter-spacing:.05em;margin:0 0 16px;opacity:.9}

/* BUTTONS */
.btn{
  padding:10px 18px;border-radius:12px;border:none;cursor:pointer;
  font-weight:800;font-size:13px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  transition:opacity .15s,transform .12s;
}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn-danger{background:linear-gradient(135deg,#ff4444,#ff6b6b)}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.btn-gold{background:linear-gradient(135deg,#ffd84d,#ff8800)}

/* INPUTS */
input,textarea,select{
  width:100%;padding:10px 14px;border-radius:10px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);
  color:#fff;font-size:14px;font-weight:600;
  outline:none;
}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label{font-size:12px;opacity:.7;display:block;margin-bottom:4px}

/* TABS */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{
  padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:800;font-size:13px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  transition:all .15s;
}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.tab:hover:not(.active){background:rgba(255,255,255,.12)}

/* CLAN BANNER */
.clan-banner{
  border-radius:18px;padding:24px;
  background:linear-gradient(135deg,var(--bannerColor,#7f5cff)44,rgba(0,0,0,.4));
  border:1px solid rgba(255,255,255,.15);
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.clan-logo{
  width:80px;height:80px;border-radius:16px;
  background-size:cover;background-position:center;
  border:2px solid rgba(255,255,255,.2);
  flex-shrink:0;
}
.clan-tag{
  font-size:28px;font-weight:900;letter-spacing:.1em;
  background:rgba(0,0,0,.35);border-radius:10px;padding:8px 16px;
}
.clan-info{flex:1;min-width:200px}
.clan-name{font-size:22px;font-weight:900;margin:0 0 4px}
.clan-desc{opacity:.75;font-size:14px;margin:0 0 10px}
.clan-stats{display:flex;gap:14px;flex-wrap:wrap}
.cstat{font-size:13px;opacity:.85}
.cstat b{color:var(--gold)}

/* BOSS */
.boss-card{
  background:linear-gradient(135deg,rgba(255,50,50,.12),rgba(200,0,0,.06));
  border:1px solid rgba(255,80,80,.25);
  border-radius:18px;padding:20px;
}
.boss-name{font-size:18px;font-weight:900;color:#ff6060;margin:0 0 12px}
.hp-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:14px;overflow:hidden;margin:8px 0}
.hp-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#ff4444,#ff8800);transition:width .5s ease}
.hp-text{font-size:13px;opacity:.8;margin-bottom:8px}
.dmg-leaderboard{margin-top:14px}
.dmg-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.dmg-row:last-child{border:none}
.dmg-me{color:var(--gold);font-weight:800}

/* MEMBERS */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.member-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;
}
.member-avatar{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0;
  background-size:cover;background-position:center;
}
.member-name{font-weight:800;font-size:13px}
.member-role{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.05em}
.member-dmg{font-size:11px;color:var(--gold);margin-top:2px}
.role-leader{color:#ffd84d}
.role-officer{color:#a0c4ff}

/* MISSIONS */
.missions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mission-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:12px;padding:14px;
}
.mission-label{font-size:13px;font-weight:800;margin-bottom:8px}
.mission-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:8px;overflow:hidden;margin:6px 0}
.mission-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.mission-bar.done{background:linear-gradient(90deg,#33ff99,#00c88c)}
.mission-prog{font-size:12px;opacity:.7}
.mission-reward{font-size:11px;color:var(--gold);margin-top:4px}
.mission-check{font-size:18px;float:right;margin-top:-2px}

/* CHAT */
.chat-messages{
  height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  padding:12px;background:rgba(0,0,0,.25);border-radius:12px;margin-bottom:12px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;
}
.chat-msg{display:flex;gap:8px;align-items:flex-start}
.chat-avatar{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:900;font-size:12px;
  background-size:cover;background-position:center;
}
.chat-body{min-width:0}
.chat-author{font-size:12px;font-weight:800;opacity:.85}
.chat-text{font-size:13px;word-break:break-word;margin-top:2px;opacity:.9}
.chat-time{font-size:10px;opacity:.45;margin-top:2px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1}

/* BANK */
.bank-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.bank-row input{flex:1;min-width:120px}
.bank-select{flex:1;min-width:120px}

/* CLAN LIST */
.clan-list{display:grid;gap:12px}
.clan-list-item{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:14px;padding:14px 16px;
  display:flex;align-items:center;gap:14px;
}
.clan-list-tag{
  font-size:16px;font-weight:900;letter-spacing:.08em;
  background:rgba(255,255,255,.08);border-radius:8px;
  padding:6px 10px;flex-shrink:0;min-width:55px;text-align:center;
}
.clan-list-info{flex:1;min-width:0}
.clan-list-name{font-weight:800;font-size:14px}
.clan-list-sub{font-size:12px;opacity:.6;margin-top:2px}
.clan-list-xp{font-size:12px;color:var(--gold);margin-top:2px}

/* CREATE FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}

/* ALERTS */
.alert{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:12px}
.alert-error{background:rgba(255,68,68,.15);border:1px solid rgba(255,68,68,.3);color:#ff8888}
.alert-success{background:rgba(51,255,153,.1);border:1px solid rgba(51,255,153,.3);color:#33ff99}

/* LEADERBOARD */
.lb-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:6px;
}
.lb-rank{font-size:16px;font-weight:900;min-width:28px;text-align:center}
.lb-rank.gold{color:var(--gold)}
.lb-rank.silver{color:#c0c0c0}
.lb-rank.bronze{color:#cd7f32}
.lb-name{flex:1;font-weight:800;font-size:14px}
.lb-xp{color:var(--gold);font-size:13px;font-weight:800}

/* LOADING */
.loading{opacity:.5;text-align:center;padding:40px;font-size:14px}

/* COLOR PICKER */
.color-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-opt{
  width:28px;height:28px;border-radius:999px;cursor:pointer;
  border:2px solid transparent;transition:border-color .15s;
}
.color-opt.selected{border-color:#fff}

/* MOBILE */
@media(max-width:768px){
  .clan-banner{flex-direction:column;align-items:flex-start}
  .members-grid{grid-template-columns:1fr 1fr}
  .missions-grid{grid-template-columns:1fr}
}

/* DEFEATED BOSS */
.boss-defeated{
  text-align:center;padding:30px;
  color:var(--green);font-weight:900;font-size:18px;
}
.no-clan-wrap{text-align:center;padding:60px 20px}
.no-clan-wrap h2{margin:0 0 10px;font-size:22px}
.no-clan-wrap p{opacity:.7;margin:0 0 24px}

/* RAID */
.raid-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
@media(max-width:600px){.raid-select-grid{grid-template-columns:1fr}}
.boss-choice{
  border:2px solid rgba(255,255,255,.12);border-radius:16px;
  padding:16px;cursor:pointer;text-align:center;
  background:rgba(255,255,255,.04);
  transition:border-color .2s,background .2s,transform .15s;
}
.boss-choice:hover{border-color:rgba(255,80,80,.5);background:rgba(255,80,80,.08);transform:translateY(-2px)}
.boss-choice img{width:100%;max-height:140px;object-fit:contain;border-radius:10px;margin-bottom:10px}
.boss-choice .boss-choice-name{font-size:16px;font-weight:900;margin-bottom:4px}
.boss-choice .boss-choice-stats{font-size:12px;opacity:.7;line-height:1.6}

.stock-bar{
  background:rgba(255,255,255,.06);border:1px solid rgba(127,92,255,.3);
  border-radius:12px;padding:14px 16px;margin-bottom:14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.stock-val{font-size:22px;font-weight:900;color:var(--accent)}
.stock-label{font-size:13px;opacity:.7}

/* Animation attaque */
@keyframes attackShake {
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-8px) rotate(-2deg)}
  30%{transform:translateX(8px) rotate(2deg)}
  45%{transform:translateX(-6px)}
  60%{transform:translateX(6px)}
  75%{transform:translateX(-3px)}
}
@keyframes attackFlash {
  0%{opacity:0;transform:scale(.5)}
  20%{opacity:1;transform:scale(1.2)}
  100%{opacity:0;transform:scale(2)}
}
@keyframes dmgPop {
  0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  30%{opacity:1;transform:translate(-50%,-120%) scale(1.2)}
  100%{opacity:0;transform:translate(-50%,-200%) scale(.8)}
}
.boss-img-wrap{position:relative;display:inline-block}
.attack-flash{
  position:absolute;inset:0;border-radius:14px;
  background:radial-gradient(circle,rgba(255,80,80,.9),transparent 70%);
  pointer-events:none;opacity:0;
}
.dmg-popup{
  position:absolute;left:50%;top:50%;
  font-size:28px;font-weight:900;color:#ff4444;
  text-shadow:0 0 20px rgba(255,68,68,.8);
  pointer-events:none;white-space:nowrap;
  animation:dmgPop .9s ease forwards;
}
.timer-bar-wrap{background:rgba(255,255,255,.1);border-radius:999px;height:6px;overflow:hidden;margin:6px 0}
.timer-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#33ff99,#ffd84d,#ff4444);transition:width 1s linear}
.talent-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;padding:14px 18px;
  background:rgba(127,92,255,.1);border:1px solid rgba(127,92,255,.25);
  border-radius:12px;flex-wrap:wrap;gap:10px;
}
.talent-points-badge{
  font-size:20px;font-weight:900;color:var(--gold);
}
.clan-xp-bar-wrap{flex:1;min-width:200px}
.clan-xp-bar-label{font-size:12px;opacity:.7;margin-bottom:4px}
.clan-xp-bar{background:rgba(255,255,255,.1);border-radius:999px;height:8px;overflow:hidden}
.clan-xp-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}

.talents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.talent-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  border-radius:14px;padding:16px;
}
.talent-card.maxed{border-color:rgba(255,216,77,.3);background:rgba(255,216,77,.06)}
.talent-icon{font-size:28px;margin-bottom:8px}
.talent-name{font-size:15px;font-weight:900;margin-bottom:4px}
.talent-desc{font-size:12px;opacity:.65;margin-bottom:12px}
.talent-levels{display:flex;gap:4px;margin-bottom:10px}
.talent-dot{
  width:18px;height:18px;border-radius:999px;
  border:2px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  transition:background .2s;
}
.talent-dot.filled{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.talent-dot.maxed{background:linear-gradient(135deg,#ffd84d,#ff8800);border-color:transparent}
.talent-current{font-size:12px;color:var(--green);margin-bottom:4px}
.talent-next{font-size:12px;opacity:.6;margin-bottom:10px}
.talent-cost{font-size:12px;color:var(--gold);margin-bottom:8px}

.section-hidden{display:none}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a class="cornerLogo" href="/"><img src="poke.png" alt="Logo"/></a>
  <nav class="topNav">
    <a class="topLink" href="/">GACHA</a>
    <a class="topLink" href="/collection.html">COLLECTION</a>
    <a class="topLink" href="/market.html">MARKET</a>
    <a class="topLink" href="/leaderboard.html">LEADERBOARD</a>
    <a class="topLink" href="/friends.html">FRIENDS</a>
    <a class="topLink" style="background:linear-gradient(135deg,rgba(127,92,255,.4),rgba(240,83,197,.4));border-color:rgba(127,92,255,.5)" href="/clan.html">CLAN</a>
  </nav>
  <div style="display:flex;gap:8px;align-items:center">
    <span style="font-size:12px;opacity:.6" id="topUsername"></span>
    <a class="topLink" href="/profile.html">PROFIL</a>
  </div>
</div>

<div class="wrap" id="mainWrap">
  <div class="loading" id="loadingMsg">Chargement...</div>
</div>

<script>
const TOKEN_KEY = "gacha_token_v1";
const token = localStorage.getItem(TOKEN_KEY);
if (!token) location.href = "/login.html";

async function api(path, opts={}) {
  const r = await fetch(path, {
    ...opts,
    headers: { ...(opts.headers||{}), "Authorization": "Bearer "+token, "Content-Type":"application/json" }
  });
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || "Erreur");
  return data;
}

function esc(s){ return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;") }
function fmtNum(n){ return Number(n||0).toLocaleString("fr-FR") }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "à l'instant";
  if(s<3600) return Math.floor(s/60)+"min";
  if(s<86400) return Math.floor(s/3600)+"h";
  return Math.floor(s/86400)+"j";
}

const COLORS = ["#7f5cff","#f053c5","#ff4444","#ff8800","#ffd84d","#33ff99","#33cfff","#a855f7","#ec4899"];

let myData = null;
let clanData = null;
let chatPolling = null;
let myUserId = null;

async function init() {
  try {
    myData = await api("/api/me");
    myUserId = myData.id;
    document.getElementById("topUsername").textContent = myData.name || "";
  } catch(e) { location.href="/login.html"; return; }

  try {
    const data = await api("/api/clan/me");
    clanData = data;
    if (data.clan) {
      renderMyClan(data);
    } else {
      renderNoClan();
    }
  } catch(e) {
    renderNoClan();
  }
}

// ===========================
// NO CLAN VIEW
// ===========================
function renderNoClan() {
  const wrap = document.getElementById("mainWrap");
  wrap.innerHTML = `
    <div class="no-clan-wrap">
      <div style="font-size:48px;margin-bottom:12px">⚔️</div>
      <h2>Tu n'es dans aucun clan</h2>
      <p>Rejoins un clan existant ou crée le tien pour participer aux raids, missions et bien plus !</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="showSection('browse')">Parcourir les clans</button>
        <button class="btn btn-ghost" onclick="showSection('create')">Créer un clan</button>
      </div>
    </div>

    <!-- BROWSE -->
    <div id="section-browse" class="section-hidden">
      <div class="card">
        <div class="card-title">🔍 Clans disponibles</div>
        <div id="clanList" class="clan-list"><div class="loading">Chargement...</div></div>
      </div>
    </div>

    <!-- CREATE -->
    <div id="section-create" class="section-hidden">
      <div class="card">
        <div class="card-title">✨ Créer un clan</div>
        <div id="createAlert"></div>
        <div class="form-grid">
          <div>
            <label>Nom du clan *</label>
            <input id="cName" maxlength="30" placeholder="Mon Super Clan"/>
          </div>
          <div>
            <label>Tag (2-5 lettres) *</label>
            <input id="cTag" maxlength="5" placeholder="MSC" style="text-transform:uppercase"/>
          </div>
        </div>
        <div style="margin-top:12px">
          <label>Description</label>
          <textarea id="cDesc" maxlength="200" placeholder="Présente ton clan..."></textarea>
        </div>
        <div style="margin-top:12px">
          <label>Image du clan (URL)</label>
          <div style="display:flex;gap:10px;align-items:center">
            <input id="cLogo" placeholder="https://..." oninput="previewLogo(this.value)"/>
            <div id="logoPreview" style="width:48px;height:48px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);flex-shrink:0;background-size:cover;background-position:center;"></div>
          </div>
        </div>
        <div style="margin-top:12px">
          <label>Couleur du clan</label>
          <div class="color-options" id="colorPicker"></div>
        </div>
        <div style="margin-top:16px;padding:12px;background:rgba(255,216,77,.08);border:1px solid rgba(255,216,77,.25);border-radius:10px;font-size:13px;">
          💰 Créer un clan coûte <b style="color:var(--gold)">1 000 dollax</b>
        </div>
        <div style="margin-top:16px;display:flex;gap:10px">
          <button class="btn" onclick="createClan()">Créer le clan</button>
          <button class="btn btn-ghost" onclick="showSection(null)">Annuler</button>
        </div>
      </div>
    </div>
  `;
  initColorPicker();
  loadClanList();
}

let selectedColor = COLORS[0];
function initColorPicker() {
  const el = document.getElementById("colorPicker");
  if (!el) return;
  el.innerHTML = COLORS.map(c =>
    `<div class="color-opt ${c===selectedColor?'selected':''}" style="background:${c}" onclick="selectColor('${c}',this)"></div>`
  ).join("");
}
function selectColor(c, el) {
  selectedColor = c;
  document.querySelectorAll(".color-opt").forEach(e => e.classList.remove("selected"));
  el.classList.add("selected");
}

function showSection(name) {
  ["browse","create"].forEach(s => {
    const el = document.getElementById("section-"+s);
    if (el) el.classList.toggle("section-hidden", s !== name);
  });
}

async function loadClanList() {
  const el = document.getElementById("clanList");
  if (!el) return;
  try {
    const data = await api("/api/clan/list");
    if (!data.clans.length) { el.innerHTML = '<div class="loading">Aucun clan pour l\'instant.</div>'; return; }
    el.innerHTML = data.clans.map(c => `
      <div class="clan-list-item">
        <div class="clan-list-tag" style="color:${esc(c.banner_color)}">[${esc(c.tag)}]</div>
        <div class="clan-list-info">
          <div class="clan-list-name">${esc(c.name)}</div>
          <div class="clan-list-sub">Chef: ${esc(c.leader_name)} · ${c.members} membre${c.members>1?'s':''}</div>
          <div class="clan-list-xp">⚡ ${fmtNum(c.xp)} XP</div>
        </div>
        <button class="btn btn-sm" onclick="joinClan(${c.id})">Rejoindre</button>
      </div>
    `).join("");
  } catch(e) { el.innerHTML = '<div class="loading">Erreur de chargement</div>'; }
}

async function joinClan(id) {
  try {
    await api("/api/clan/join", { method:"POST", body: JSON.stringify({ clanId: id }) });
    location.reload();
  } catch(e) { alert(e.message); }
}

async function createClan() {
  const name  = document.getElementById("cName").value.trim();
  const tag   = document.getElementById("cTag").value.trim().toUpperCase();
  const desc  = document.getElementById("cDesc").value.trim();
  const logo  = document.getElementById("cLogo").value.trim();
  const alertEl = document.getElementById("createAlert");

  if (!name || !tag) { alertEl.innerHTML = '<div class="alert alert-error">Nom et tag requis.</div>'; return; }

  try {
    await api("/api/clan/create", { method:"POST", body: JSON.stringify({ name, tag, description: desc, logo, banner_color: selectedColor }) });
    location.reload();
  } catch(e) {
    alertEl.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

function previewLogo(url) {
  const el = document.getElementById("logoPreview");
  if (!el) return;
  el.style.backgroundImage = url ? `url('${url}')` : '';
}

function renderMemberCard(m, isOfficer, isLeader, leaderName) {
  const isMe = m.name === (myData?.name);
  const avatarStyle = m.avatar ? `background-image:url('${esc(m.avatar)}')` : '';
  const initials = (m.name||"?").slice(0,2).toUpperCase();

  let actions = '';
  if (isLeader && m.name !== leaderName) {
    actions = `
      <div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">
        ${m.role==='member'?`<button class="btn btn-sm" style="font-size:10px;padding:4px 8px" onclick="promoteUser('${esc(m.name)}','officer')">→ Officier</button>`:''}
        ${m.role==='officer'?`<button class="btn btn-ghost btn-sm" style="font-size:10px;padding:4px 8px" onclick="promoteUser('${esc(m.name)}','member')">→ Membre</button>`:''}
        <button class="btn btn-danger btn-sm" style="font-size:10px;padding:4px 8px" onclick="kickUser('${esc(m.name)}')">Exclure</button>
      </div>
    `;
  }

  return `
    <div class="member-card" ${isMe?'style="border-color:rgba(127,92,255,.4);background:rgba(127,92,255,.08)"':''}>
      <div class="member-avatar" style="${avatarStyle}">${avatarStyle?'':initials}</div>
      <div style="min-width:0;flex:1">
        <div class="member-name">${esc(m.name)} ${isMe?'<span style="font-size:10px;color:var(--accent)">(toi)</span>':''}</div>
        <div class="member-role ${m.role==='leader'?'role-leader':m.role==='officer'?'role-officer':''}">${m.role==='leader'?'👑 Meneur':m.role==='officer'?'⭐ Officier':'Membre'}</div>
        <div class="member-dmg">⚔️ ${fmtNum(m.damage_total)} dmg total</div>
        ${actions}
      </div>
    </div>
  `;
}

let currentTab = 'boss';
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  ['boss','missions','members','chat','talents','leaderboard','manage'].forEach(t => {
    const tabEl = document.getElementById('tab-'+t);
    if (tabEl) tabEl.classList.toggle('section-hidden', t !== name);
  });

  currentTab = name;

  if (name === 'chat') { loadChat(); startChatPolling(); } else { stopChatPolling(); }
  if (name === 'leaderboard') loadLeaderboard();
  if (name === 'boss') { _bossFirstLoad = true; loadBossData(); startBossPolling(); } else { stopBossPolling(); }
  if (name === 'talents') loadTalents();
}

// ===========================
// BOSS
// ===========================
let _raidTimer = null;
let _raidExpiresAt = null;
let _raidBossId = null;
let _bossFirstLoad = true;

async function loadBossData() {
  try {
    let data;

    // Premier chargement : utiliser les données déjà dans la réponse /api/clan/me
    if (_bossFirstLoad && window._initialBossData) {
      _bossFirstLoad = false;
      data = window._initialBossData;
      // Compléter avec myStock/leaderboard si manquants → appel API léger
      if (data.boss && (data.boss.myStock === undefined || !data.boss.leaderboard)) {
        const fresh = await api("/api/clan/boss");
        data = fresh;
      }
    } else {
      data = await api("/api/clan/boss");
    }

    // Pas de raid actif → afficher sélection
    if (!data.boss) {
      const choicesEl = document.getElementById("bossChoices");
      if (!choicesEl) return;

      const canStart = ['leader','officer'].includes(window._clanData?.myRole);
      const bosses = data.availableBosses || [];

      choicesEl.innerHTML = bosses.map(b => `
        <div class="boss-choice" onclick="${canStart ? `startRaid('${b.key}')` : 'void(0)'}">
          <img src="${esc(b.image)}" alt="${esc(b.name)}" onerror="this.style.display='none'">
          <div class="boss-choice-name">👹 ${esc(b.name)}</div>
          <div class="boss-choice-stats">
            ❤️ ${fmtNum(b.hp_max)} PV<br>
            🏆 ${fmtNum(b.reward)} dollax<br>
            ⏱️ 4h pour le vaincre
          </div>
          ${canStart
            ? `<button class="btn btn-danger btn-sm" style="margin-top:10px;width:100%" onclick="event.stopPropagation();startRaid('${b.key}')">Lancer ce raid</button>`
            : `<div style="font-size:11px;opacity:.5;margin-top:8px">Meneur/Officier seulement</div>`
          }
        </div>
      `).join('');
      return;
    }

    // Raid actif → mettre à jour l'UI
    const boss = data.boss;
    _raidBossId = boss.id;
    _raidExpiresAt = boss.expires_at ? Number(boss.expires_at) : null;

    // Stock
    const myStock = boss.myStock ?? data.myStock ?? 0;
    const stockEl = document.getElementById("stockVal");
    if (stockEl) stockEl.textContent = fmtNum(myStock);

    const attackBtn = document.getElementById("attackBtn");
    if (attackBtn) {
      attackBtn.disabled = myStock <= 0;
      attackBtn.textContent = myStock > 0 ? `⚔️ ATTAQUER ! (${fmtNum(myStock)} dmg)` : '⚔️ Ouvre des cartes...';
    }

    // HP bar
    const pct = Math.max(0, Math.round((boss.hp_current / boss.hp_max) * 100));
    const hpBar = document.getElementById("bossHpBar");
    if (hpBar) hpBar.style.width = pct + '%';

    // Leaderboard
    const leaderboard = boss.leaderboard ?? data.leaderboard ?? [];
    const lbEl = document.getElementById("bossLeaderboard");
    if (lbEl && leaderboard.length >= 0) {
      lbEl.innerHTML = leaderboard.map((r,i) =>
        `<div class="dmg-row ${r.name===myData?.name?'dmg-me':''}">
          <span>#${i+1} ${esc(r.name)}</span>
          <span>⚔️ ${fmtNum(r.total)}</span>
        </div>`
      ).join('') || '<div style="opacity:.5;font-size:13px">Aucun dégât encore</div>';
    }

    // Timer
    startRaidTimer();
  } catch(e) {}
}

function startRaidTimer() {
  if (_raidTimer) clearInterval(_raidTimer);
  if (!_raidExpiresAt) return;

  function updateTimer() {
    const left = Math.max(0, _raidExpiresAt - Date.now());
    const h = Math.floor(left / 3600000);
    const m = Math.floor((left % 3600000) / 60000);
    const s = Math.floor((left % 60000) / 1000);
    const txt = left > 0
      ? `⏱️ ${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s restantes`
      : '⏰ Temps écoulé !';

    const timerEl = document.getElementById("timerDisplay");
    if (timerEl) timerEl.textContent = txt;

    // Barre timer
    const bossQ = window._lastBossData;
    if (bossQ?.started_at && _raidExpiresAt) {
      const total = _raidExpiresAt - bossQ.started_at;
      const elapsed = Date.now() - bossQ.started_at;
      const pct = Math.max(0, 100 - Math.round((elapsed / total) * 100));
      const bar = document.getElementById("timerBar");
      if (bar) bar.style.width = pct + '%';
    }

    if (left <= 0) {
      clearInterval(_raidTimer);
      loadBossData(); // Recharger pour afficher état expiré
    }
  }
  updateTimer();
  _raidTimer = setInterval(updateTimer, 1000);
}

async function startRaid(bossKey) {
  const alertEl = document.getElementById("raidAlert");
  try {
    await api("/api/clan/raid/start", { method:"POST", body: JSON.stringify({ bossKey }) });
    // Recharger la page du clan pour afficher le raid
    location.reload();
  } catch(e) {
    if (alertEl) alertEl.innerHTML = `<div class="alert alert-error" style="margin-top:12px">${esc(e.message)}</div>`;
    else alert(e.message);
  }
}

async function attackBoss() {
  const btn = document.getElementById("attackBtn");
  if (btn) btn.disabled = true;

  try {
    const data = await api("/api/clan/raid/attack", { method:"POST" });

    // Animation d'attaque
    playAttackAnimation(data.damage);

    // ✅ Mise à jour immédiate des HP dans l'UI
    if (data.boss) {
      const pct = Math.max(0, Math.round((data.newHp / data.boss.hp_max) * 100));
      const hpBar = document.getElementById("bossHpBar");
      const hpText = document.querySelector(".hp-text");
      if (hpBar) {
        hpBar.style.width = pct + '%';
        const barColor = pct > 50 ? '#ff4444' : pct > 20 ? '#ff8800' : '#33ff99';
        hpBar.style.background = barColor;
      }
      if (hpText) hpText.innerHTML = `${fmtNum(data.newHp)} / ${fmtNum(data.boss.hp_max)} PV · <span style="color:var(--gold)">🏆 ${fmtNum(data.boss.reward)} dollax</span>`;
      const pctText = document.querySelector('.boss-card [style*="opacity:.6"]');
      if (pctText) pctText.textContent = pct + '% restants';
    }

    // ✅ Mise à jour immédiate du leaderboard
    if (data.leaderboard) {
      const lbEl = document.getElementById("bossLeaderboard");
      if (lbEl) {
        lbEl.innerHTML = data.leaderboard.map((r,i) =>
          `<div class="dmg-row ${r.name===myData?.name?'dmg-me':''}">
            <span>#${i+1} ${esc(r.name)}</span>
            <span>⚔️ ${fmtNum(r.total)}</span>
          </div>`
        ).join('') || '<div style="opacity:.5;font-size:13px">Aucun dégât encore</div>';
      }
    }

    if (data.defeated) {
      setTimeout(() => {
        showAlert('🏆 Boss vaincu ! Récompenses distribuées !', 'success');
        setTimeout(() => location.reload(), 2000);
      }, 800);
    } else {
      if (btn) { btn.disabled = false; btn.textContent = '⚔️ Ouvre des cartes...'; }
    }
  } catch(e) {
    alert(e.message);
    if (btn) btn.disabled = false;
  }
}

function playAttackAnimation(dmg) {
  // Shake le boss
  const img = document.getElementById("bossImg");
  const wrap = document.getElementById("bossImgWrap");
  const flash = document.getElementById("attackFlash");

  if (wrap) {
    wrap.style.animation = 'none';
    void wrap.offsetWidth;
    wrap.style.animation = 'attackShake .5s ease';
    setTimeout(() => { wrap.style.animation = ''; }, 500);
  }

  if (flash) {
    flash.style.animation = 'none';
    void flash.offsetWidth;
    flash.style.opacity = '1';
    flash.style.animation = 'attackFlash .6s ease forwards';
    setTimeout(() => { flash.style.opacity = '0'; }, 600);
  }

  // Popup dégâts
  if (wrap) {
    const popup = document.createElement('div');
    popup.className = 'dmg-popup';
    popup.textContent = `-${fmtNum(dmg)}`;
    wrap.appendChild(popup);
    setTimeout(() => popup.remove(), 900);
  }

  // Vider le stock dans l'UI
  const stockEl = document.getElementById("stockVal");
  if (stockEl) stockEl.textContent = '0';
  const attackBtn = document.getElementById("attackBtn");
  if (attackBtn) attackBtn.textContent = '⚔️ Ouvre des cartes...';
}

function showAlert(msg, type='success') {
  const div = document.createElement('div');
  div.className = `alert alert-${type}`;
  div.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9999;min-width:300px;text-align:center';
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// ===========================
// MISSIONS
// ===========================
async function loadMissions() {
  const el = document.getElementById("missionsContent");
  if (!el) return;
  try {
    const data = await api("/api/clan/missions");
    el.innerHTML = `<div class="missions-grid">` +
      data.missions.map(m => {
        const pct = m.goal > 0 ? Math.min(100, Math.round((m.progress/m.goal)*100)) : 0;
        return `
          <div class="mission-card" ${m.completed?'style="border-color:rgba(51,255,153,.3);background:rgba(51,255,153,.05)"':''}>
            <div class="mission-label">
              ${esc(m.label)}
              ${m.completed?'<span class="mission-check">✅</span>':''}
            </div>
            <div class="mission-bar-wrap">
              <div class="mission-bar ${m.completed?'done':''}" style="width:${pct}%"></div>
            </div>
            <div class="mission-prog">${m.progress}/${m.goal}</div>
            <div class="mission-reward">🏅 +${m.xpClan} XP clan · +${m.bankReward} dollax banque</div>
          </div>
        `;
      }).join("") + `</div>`;
  } catch(e) { el.innerHTML = '<div class="loading">Erreur</div>'; }
}

// ===========================
// CHAT
// ===========================
async function loadChat() {
  const el = document.getElementById("chatMessages");
  if (!el) return;
  try {
    const data = await api("/api/clan/chat");
    const wasAtBottom = el.scrollHeight - el.scrollTop <= el.clientHeight + 40;
    el.innerHTML = data.messages.map(m => {
      const avatarStyle = m.avatar ? `style="background-image:url('${esc(m.avatar)}')"` : '';
      const initials = (m.username||"?").slice(0,2).toUpperCase();
      return `
        <div class="chat-msg">
          <div class="chat-avatar" ${avatarStyle}>${m.avatar?'':initials}</div>
          <div class="chat-body">
            <div class="chat-author">${esc(m.username)} <span class="chat-time">${timeAgo(m.createdat||m.createdAt)}</span></div>
            <div class="chat-text">${esc(m.message)}</div>
          </div>
        </div>
      `;
    }).join("");
    if (wasAtBottom || data.messages.length < 5) el.scrollTop = el.scrollHeight;
  } catch(e) {}
}

async function sendChat() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  try {
    await api("/api/clan/chat", { method:"POST", body: JSON.stringify({ message: msg }) });
    await loadChat();
  } catch(e) { alert(e.message); }
}

let _bossPolling = null;
function startBossPolling() {
  stopBossPolling();
  _bossPolling = setInterval(() => { if (currentTab === 'boss') loadBossData(); }, 15000);
}
function stopBossPolling() {
  if (_bossPolling) { clearInterval(_bossPolling); _bossPolling = null; }
}

function startChatPolling() {
  stopChatPolling();
  chatPolling = setInterval(() => { if (currentTab==='chat') loadChat(); }, 5000);
}
function stopChatPolling() {
  if (chatPolling) { clearInterval(chatPolling); chatPolling=null; }
}

// ===========================
// LEADERBOARD
// ===========================
async function loadLeaderboard() {
  const el = document.getElementById("lbContent");
  if (!el) return;
  try {
    const data = await api("/api/clan/leaderboard");
    const rankClass = (i) => i===0?'gold':i===1?'silver':i===2?'bronze':'';
    el.innerHTML = data.clans.map((c,i) => `
      <div class="lb-row">
        <div class="lb-rank ${rankClass(i)}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
        <div style="flex:1">
          <span style="color:${esc(c.banner_color)};font-weight:900">[${esc(c.tag)}]</span>
          <span class="lb-name"> ${esc(c.name)}</span>
          <span style="font-size:11px;opacity:.5;margin-left:6px">Niv.${c.level||1}</span>
        </div>
        <div style="font-size:12px;opacity:.6;margin-right:12px">${c.members} mbr</div>
        <div class="lb-xp">⚡ ${fmtNum(c.xp)}</div>
      </div>
    `).join("");
  } catch(e) { el.innerHTML='<div class="loading">Erreur</div>'; }
}

// ===========================
// TALENTS
// ===========================
let _talentData = null;

async function loadTalents() {
  const el = document.getElementById("talentsContent");
  if (!el) return;
  try {
    const data = await api("/api/clan/talents");
    _talentData = data;
    const canUpgrade = ['leader','officer'].includes(data.myRole);
    const xpPct = data.nextLevelXp > 0 ? Math.min(100, Math.round((data.xpIntoLevel / data.nextLevelXp) * 100)) : 100;

    el.innerHTML = `
      <div class="talent-header">
        <div>
          <div style="font-size:13px;opacity:.7;margin-bottom:2px">Niveau du clan</div>
          <div style="font-size:22px;font-weight:900">🏰 Niveau ${data.clanLevel}</div>
        </div>
        <div class="clan-xp-bar-wrap">
          <div class="clan-xp-bar-label">${fmtNum(data.xpIntoLevel)} / ${fmtNum(data.nextLevelXp)} XP → Niveau ${data.clanLevel+1}</div>
          <div class="clan-xp-bar"><div class="clan-xp-bar-fill" style="width:${xpPct}%"></div></div>
        </div>
        <div style="text-align:right">
          <div style="font-size:12px;opacity:.7">Points disponibles</div>
          <div class="talent-points-badge">✨ ${data.talentPoints} pt${data.talentPoints>1?'s':''}</div>
        </div>
      </div>

      ${data.talentPoints === 0 && data.clanLevel === 1 ? `
        <div style="text-align:center;padding:20px;opacity:.6;font-size:13px">
          Complète des missions et vaincs des boss pour gagner de l'XP et monter de niveau !<br>
          Chaque level up donne <b>1 point de talent</b> à distribuer.
        </div>` : ''}

      <div class="talents-grid">
        ${data.talents.map(t => {
          const dots = Array.from({length: t.maxLevel}, (_,i) =>
            `<div class="talent-dot ${i < t.currentLevel ? (t.maxReached ? 'maxed' : 'filled') : ''}"></div>`
          ).join('');
          return `
            <div class="talent-card ${t.maxReached ? 'maxed' : ''}">
              <div class="talent-icon">${t.icon}</div>
              <div class="talent-name">${esc(t.label)}</div>
              <div class="talent-desc">${esc(t.description)}</div>
              <div class="talent-levels">${dots}</div>
              <div class="talent-current">✅ Actuel : ${esc(t.currentBonus)}</div>
              ${t.nextBonus ? `<div class="talent-next">➡️ Niveau suivant : ${esc(t.nextBonus)}</div>` : ''}
              ${t.maxReached
                ? `<div style="font-size:12px;color:var(--gold);font-weight:800">🏆 Maximum atteint !</div>`
                : canUpgrade && data.talentPoints >= (t.costNext||99)
                  ? `<div class="talent-cost">Coût : ${t.costNext} point${t.costNext>1?'s':''}</div>
                     <button class="btn btn-sm" onclick="upgradeTalent('${t.key}')">Améliorer ✨</button>`
                  : `<div class="talent-cost" style="opacity:.5">Coût : ${t.costNext||'?'} point${(t.costNext||1)>1?'s':''}</div>
                     <button class="btn btn-sm btn-ghost" disabled>${!canUpgrade ? 'Meneur/Officier seulement' : 'Pas assez de points'}</button>`
              }
            </div>
          `;
        }).join('')}
      </div>
    `;
  } catch(e) { el.innerHTML = '<div class="loading">Erreur de chargement</div>'; }
}

async function upgradeTalent(key) {
  try {
    await api("/api/clan/talents/upgrade", { method:"POST", body: JSON.stringify({ key }) });
    await loadTalents();
  } catch(e) { alert(e.message); }
}

// ===========================
// MANAGE ACTIONS
// ===========================
async function distributeBank() {
  const target = document.getElementById("bankTarget")?.value;
  const amount = Number(document.getElementById("bankAmount")?.value)||0;
  const alertEl = document.getElementById("bankAlert");
  if (!target || amount < 1) { alertEl.innerHTML='<div class="alert alert-error">Sélectionne un membre et un montant.</div>'; return; }

  const members = window._clanMembers || [];
  const member = members.find(m => m.name === target);
  if (!member) { alertEl.innerHTML='<div class="alert alert-error">Membre introuvable.</div>'; return; }

  try {
    await api("/api/clan/bank/distribute", { method:"POST", body: JSON.stringify({ userId: member.user_id || member.id, amount }) });
    alertEl.innerHTML=`<div class="alert alert-success">✅ ${fmtNum(amount)} dollax envoyés à ${esc(target)} !</div>`;
    setTimeout(()=>location.reload(), 1500);
  } catch(e) { alertEl.innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`; }
}

async function leaveClan() {
  if (!confirm("Quitter le clan ?")) return;
  try {
    await api("/api/clan/leave", { method:"POST" });
    location.reload();
  } catch(e) { alert(e.message); }
}

async function kickUser(name) {
  if (!confirm(`Exclure ${name} ?`)) return;
  const m = (window._clanMembers||[]).find(m=>m.name===name);
  if (!m) return;
  try {
    await api("/api/clan/kick", { method:"POST", body: JSON.stringify({ userId: m.user_id||m.id }) });
    location.reload();
  } catch(e) { alert(e.message); }
}

async function promoteUser(name, role) {
  const m = (window._clanMembers||[]).find(m=>m.name===name);
  if (!m) return;
  try {
    await api("/api/clan/promote", { method:"POST", body: JSON.stringify({ userId: m.user_id||m.id, role }) });
    location.reload();
  } catch(e) { alert(e.message); }
}

function disbandConfirm() {
  document.getElementById('dissolveConfirmBox').style.display = 'block';
  document.getElementById('dissolveInput').focus();
}

async function dissolveClan() {
  const input = document.getElementById("dissolveInput")?.value.trim();
  const alertEl = document.getElementById("dissolveAlert");

  if (input !== "DISSOUDRE") {
    alertEl.innerHTML = '<div class="alert alert-error">Tape exactement DISSOUDRE pour confirmer.</div>';
    return;
  }

  try {
    await api("/api/clan/dissolve", { method: "POST", body: JSON.stringify({ confirm: "DISSOUDRE" }) });
    alertEl.innerHTML = '<div class="alert alert-success">Clan dissous. Redirection...</div>';
    setTimeout(() => location.reload(), 1500);
  } catch(e) {
    alertEl.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

// ===========================
// INIT
// ===========================
init().finally(() => {
  document.getElementById("loadingMsg")?.remove();
});

// Load boss data on start if clan exists
setTimeout(() => {
  if (document.getElementById("bossLeaderboard") || document.getElementById("bossChoices") || document.getElementById("raidAlert")) {
    loadBossData();
    startBossPolling();
  }
}, 500);
</script>
